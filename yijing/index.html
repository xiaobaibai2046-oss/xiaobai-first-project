log button small{display:block;color:var(--muted);margin:7px}.answer{display:block;text-align:left;width:100%;background:transparent;color:var(--ink);border-color:var(--line);margin:12px 0}.feedback{padding:17px;background:#e7ecdf;line-height:1.8;margin:18px 0}.progress{height:5px;background:#e1e3d9;margin:18px 0}.progress i{display:block;height:100%;background:var(--green)}footer{margin-top:55px;padding:24px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.9}#toast{position:fixed;bottom:25px;right:25px;background:var(--green);color:white;padding:12px 20px;border-radius:4px;display:none}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.pill{font-size:11px;color:var(--accent)}.detail{margin-bottom:20px}.empty{padding:30px;color:var(--muted)}@media(min-width:1400px){main{padding:0 75px}}@media(max-width:1000px){aside{width:190px;padding:35px 16px}main{margin-left:190px;padding:0 25px}.grid{grid-template-columns:repeat(2,1fr)}.catalog{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){aside{position:relative;width:100%;padding:20px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:25px}.brand span{display:inline-block;letter-spacing:1px;font-size:9px}.aside-label,.aside-foot{display:none}nav{display:flex;overflow:auto;margin-top:15px;gap:8px}nav a{white-space:nowrap;padding:10px;margin:0;font-size:12px}main{margin:0;padding:0 20px}header{font-size:10px}.badge{font-size:9px}.hero{grid-template-columns:1fr;padding:30px 0 20px}.hero-art{display:none}h1{font-size:31px}.grid,.lab{grid-template-columns:1fr}.catalog{grid-template-columns:repeat(2,1fr)}.stat{padding:15px 10px}.stat strong{font-size:25px}.stat span{font-size:10px}.quote{padding:17px;font-size:20px}.reading p{font-size:16px}}

</style></head><body><aside><a class="brand" href="#home">观易<span>YI JING · STUDY</span></a><p class="aside-label">循序而进，观象明理</p><nav aria-label="主导航"><a href="#home">◈ 学习概览</a><a href="#lessons">☷ 入门课程</a><a href="#lab">☰ 卦象实验室</a><a href="#library">▦ 六十四卦</a><a href="#practice">✧ 巩固练习</a><a href="#notes">✎ 我的笔记</a></nav><div class="aside-foot">学易，是学习观察变化。<br><small>原典 · 结构 · 思考</small></div></aside><main><header><span>《周易》入门学习手册</span><span class="badge">零基础友好 · 本地保存</span></header><div id="app"></div><footer>原文出处按篇名标注，标点为现代整理；白话说明为本软件编写。基础参考：《周易》经文及《系辞》《说卦》。本版未收录完整六十四卦卦爻辞。学习记录仅保存在当前浏览器，请定期导出备份。</footer></main><div id="toast" role="status"></div><script type="module">// 三位二进制按初爻到三爻排列，1 为阳。
const trigrams=[{name:'乾',bits:'111',image:'天',quality:'健'},{name:'兑',bits:'110',image:'泽',quality:'悦'},{name:'离',bits:'101',image:'火',quality:'丽（附着）'},{name:'震',bits:'100',image:'雷',quality:'动'},{name:'巽',bits:'011',image:'风',quality:'入'},{name:'坎',bits:'010',image:'水',quality:'陷'},{name:'艮',bits:'001',image:'山',quality:'止'},{name:'坤',bits:'000',image:'地',quality:'顺'}];
const names='乾 坤 屯 蒙 需 讼 师 比 小畜 履 泰 否 同人 大有 谦 豫 随 蛊 临 观 噬嗑 贲 剥 复 无妄 大畜 颐 大过 坎 离 咸 恒 遁 大壮 晋 明夷 家人 睽 蹇 解 损 益 夬 姤 萃 升 困 井 革 鼎 震 艮 渐 归妹 丰 旅 巽 兑 涣 节 中孚 小过 既济 未济'.split(' ');
// 文王卦序；每对数字分别索引上卦、下卦。
const pairs=[[0,0],[7,7],[5,3],[6,5],[5,0],[0,5],[7,5],[5,7],[4,0],[0,1],[7,0],[0,7],[0,2],[2,0],[7,6],[3,7],[1,3],[6,4],[7,1],[4,7],[2,3],[6,2],[6,7],[7,3],[0,3],[6,0],[6,3],[1,4],[5,5],[2,2],[1,6],[3,4],[0,6],[3,0],[2,7],[7,2],[4,2],[2,1],[5,6],[3,5],[6,1],[4,3],[1,0],[0,4],[1,7],[7,4],[1,5],[5,4],[1,2],[2,4],[3,3],[6,6],[4,6],[3,1],[3,2],[2,6],[4,4],[1,1],[4,5],[5,1],[4,1],[3,6],[5,2],[2,5]];
const hexagrams=names.map((name,i)=>({id:i+1,name,upper:trigrams[pairs[i][0]],lower:trigrams[pairs[i][1]],bits:trigrams[pairs[i][1]].bits+trigrams[pairs[i][0]].bits}));
const lessons=[
{title:'先认识《周易》',tag:'起步 · 约 3 分钟',body:'《周易》经文包括六十四卦的卦画、卦辞和爻辞。《易传》是解释经文的一组传文，传统合称“十翼”。学习时先区分经与传，再区分古文原意与后世解读。',quote:'易有太极，是生两仪，两仪生四象，四象生八卦。',source:'《周易·系辞上传》',task:'用自己的话写下：“经文”和“传文”有什么区别？'},
{title:'阴阳与爻：读图的第一步',tag:'基础 · 约 4 分钟',body:'一条完整的横线表示阳爻，一条中间断开的横线表示阴爻。六画卦的爻位从下往上数，依次为初、二、三、四、五、上。阴阳不是简单的好坏标签，应结合具体语境理解。',quote:'一阴一阳之谓道。',source:'《周易·系辞上传》',task:'打开“卦象实验室”，把最下面一爻改变一次，观察卦名是否改变。'},
{title:'八卦：三个爻的八种组合',tag:'基础 · 约 5 分钟',body:'三个爻共有八种阴阳组合。乾、兑、离、震、巽、坎、艮、坤分别常取象为天、泽、火、雷、风、水、山、地。取象帮助理解关系，并不表示一个卦只能对应一种事物。',quote:'乾，健也；坤，顺也；震，动也；巽，入也；坎，陷也；离，丽也；艮，止也；兑，说也。',source:'《周易·说卦传》（“说”通“悦”）',task:'尝试认出乾、坤、坎、离，并画出它们的三爻。'},
{title:'上下卦：组成六十四卦',tag:'进阶 · 约 5 分钟',body:'把两个三画卦上下相重，形成六画卦。下方三爻组成下卦（内卦），上方三爻组成上卦（外卦）。八种上卦乘八种下卦，共有六十四种组合。目录使用通行的文王卦序，它与二进制顺序不同。',quote:'八卦成列，象在其中矣；因而重之，爻在其中矣。',source:'《周易·系辞下传》',task:'将上卦设为坎、下卦设为离，找到第六十三卦“既济”。'},
{title:'怎样阅读一卦',tag:'阅读 · 约 5 分钟',body:'先看卦名与卦画，再读卦辞，最后按爻位读爻辞。“初九”表示初位为阳爻，“六二”表示第二位为阴爻。这里的九、六是传统爻题用数。本软件的结构解说是学习提示，不冒充古代经文或逐卦完整注疏。',quote:'乾：元亨利贞。',source:'《周易》乾卦卦辞（标点为今人所加）',task:'在纯乾卦上，从下往上读出：初九、九二、九三、九四、九五、上九。'},
{title:'变化、处境与学习边界',tag:'应用 · 约 4 分钟',body:'阅读《易经》时可以练习思考变化、位置和行动时机。先提出具体问题，再比较不同处境下行动的条件。避免把模糊的文字直接当作确定结论；现实决策仍需事实与专业知识。此版本以基础学习为主，不提供吉凶预测。',quote:'穷则变，变则通，通则久。',source:'《周易·系辞下传》',task:'记下一件正在变化的事：哪些条件已知？哪些判断还需要证据？'}];
const questions=[{q:'六爻的顺序应该怎样读？',options:['从下往上','从上往下','从中间往两端'],answer:0,why:'初爻在最下方，上爻在最上方。'}, {q:'坎卦的三爻从下往上是？',options:['阳、阴、阳','阴、阳、阴','阳、阳、阴'],answer:1,why:'坎为阴、阳、阴；离为阳、阴、阳。'}, {q:'上坎下离是哪一卦？',options:['未济','泰','既济'],answer:2,why:'既济为上坎下离，通行卦序第 63；未济为上离下坎。'}, {q:'《系辞》属于哪一部分？',options:['《易传》','六十四卦卦辞','六十四卦爻辞'],answer:0,why:'《系辞》分上下篇，是《易传》的组成部分。'}, {q:'两个三画卦上下相重，共有几种组合？',options:['八种','六十四种','三十二种'],answer:1,why:'八种上卦 × 八种下卦 = 六十四卦。'}];

const app=document.querySelector('#app');
let state={done:[],favorites:[],notes:'',wrong:[],attempts:0,correct:0};
try{const saved=JSON.parse(localStorage.getItem('guanyi-v1')||'null');if(saved&&typeof saved==='object'){for(const key of ['done','favorites','wrong'])if(Array.isArray(saved[key]))state[key]=saved[key].filter(Number.isInteger);if(typeof saved.notes==='string')state.notes=saved.notes;for(const key of ['attempts','correct'])if(Number.isFinite(saved[key])&&saved[key]>=0)state[key]=saved[key];}}catch{notify('无法读取本地记录，本次仍可学习。');}
let bits='111111',selected=1,question=0,answered=false,search='';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){const t=document.querySelector('#toast');t.textContent=message;t.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.style.display='none',2800);}
function save(){try{localStorage.setItem('guanyi-v1',JSON.stringify(state));return true;}catch{notify('保存失败，请导出备份；当前记录仅暂存于页面。');return false;}}
function hex(value,interactive=false){return `<div class="hex ${interactive?'large':''}" aria-label="卦象，从下往上为${[...value].map(v=>v==='1'?'阳':'阴').join('、')}">${[...value].map((v,i)=>interactive?`<button class="line ${v==='1'?'yang':''}" data-line="${i}" aria-label="第 ${i+1} 爻：${v==='1'?'阳':'阴'}，点击改变">${v==='0'?'<i></i><i></i>':''}</button>`:`<span class="line ${v==='1'?'yang':''}">${v==='0'?'<i></i><i></i>':''}</span>`).join('')}</div>`;}
function heading(k,title,description){return `<div class="hero"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="muted">${description}</p></div><div class="hero-art" aria-hidden="true">${hex('010101')}</div></div>`;}
function render(){const route=location.hash.slice(1)||'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash.slice(1)===route.split('/')[0]));
if(route==='home'){app.innerHTML=heading('A LITTLE EVERY DAY','每天读懂一点变化','从一阴一阳出发，循序认识《周易》。不急于求答案，先学会看懂卦象。')+`<div class="stats"><div class="stat"><strong>${state.done.length}<small> / 6</small></strong><span>已完成入门课程</span></div><div class="stat"><strong>${state.favorites.length}</strong><span>收藏的卦象</span></div><div class="stat"><strong>${state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—'}</strong><span>练习正确率 · ${state.attempts} 次作答</span></div></div><div class="section-top"><h2>今天，从这里开始</h2><small>每课约 3—5 分钟</small></div><div class="grid"><article class="card"><span class="pill">01 / 循序入门</span><h3>${escape(lessons[Math.max(0,lessons.findIndex((_,i)=>!state.done.includes(i)))].title)}</h3><p class="muted">先建立清晰的基础，再走近古老的文字。</p><a class="button" href="#lessons/${Math.max(0,lessons.findIndex((_,i)=>!state.done.includes(i)))}">继续学习 →</a></article><article class="card"><span class="pill">02 / 动手观察</span><h3>让卦象在指尖变化</h3><p class="muted">改变一爻，观察上下卦与六十四卦的关系。</p><a href="#lab">进入卦象实验室 →</a></article><article class="card"><span class="pill">03 / 温故知新</span><h3>用小练习检验理解</h3><p class="muted">从认爻到识卦，答后解释帮助你记住原理。</p><a href="#practice">开始练习 →</a></article></div><div class="quote">一阴一阳之谓道。<small>《周易·系辞上传》 · 先观察差异，再理解关系。</small></div>`;}
else if(route==='lessons'){app.innerHTML=heading('LEARNING PATH','由浅入深，循序而进','六节入门课，每次掌握一个概念。完成后可以随时回来复习。')+`<div class="grid">${lessons.map((l,i)=>`<article class="card"><span class="pill">${state.done.includes(i)?'✓ 已完成':String(i+1).padStart(2,'0')+' / '+l.tag}</span><h3>${l.title}</h3><p class="muted">${l.body.slice(0,48)}…</p><a href="#lessons/${i}">阅读本课 →</a></article>`).join('')}</div>`;}
else if(route.startsWith('lessons/')){const i=Number(route.split('/')[1]),l=lessons[i];if(!l){location.hash='lessons';return;}app.innerHTML=`<div class="reading"><p><a href="#lessons">← 课程目录</a></p>${heading(l.tag,l.title,'先读一遍，再动手试试。')}<p>${l.body}</p><div class="quote">${l.quote}<small>原文出处：${l.source}</small></div><article class="card"><h3>这一课，试着想一想</h3><p>${l.task}</p><a href="#notes">写下我的理解 →</a></article><p><button data-complete="${i}">${state.done.includes(i)?'✓ 已完成 · 再次复习':'标记本课完成'}</button> ${i<5?`<a class="button" href="#lessons/${i+1}">下一课 →</a>`:'<a class="button" href="#practice">开始练习 →</a>'}</p></div>`;}
else if(route==='lab'){const h=hexagrams.find(h=>h.bits===bits);app.innerHTML=heading('HEXAGRAM LAB','一爻之变，亲手观察','点击任意一爻切换阴阳。最下方为初爻，最上方为上爻。')+`<div class="lab"><article class="card">${hex(bits,true)}<p class="muted" style="text-align:center">↑ 从下向上读爻</p></article><article class="card"><span class="eyebrow">第 ${h.id} 卦</span><h2>${h.name} · 上${h.upper.name}下${h.lower.name}</h2><p>上卦：${h.upper.name}，取象为${h.upper.image}。<br>下卦：${h.lower.name}，取象为${h.lower.image}。</p><div class="controls">${['upper','lower'].map((k,j)=>`<label>${j?'下卦':'上卦'}<select id="${k}">${trigrams.map(t=>`<option value="${t.bits}" ${t.bits===h[k].bits?'selected':''}>${t.name} · ${t.image}</option>`).join('')}</select></label>`).join('')}</div><p class="muted">此处展示卦象结构，不以变爻预测事件。</p><button data-view="${h.id}">查看此卦 →</button></article></div>`;}
else if(route==='library'){app.innerHTML=heading('64 HEXAGRAMS','六十四卦，一览其象','按通行文王卦序排列。可查询卦名、卦序、上下卦及其取象。')+`<input id="search" aria-label="搜索卦象" placeholder="搜索卦名、卦序或取象，例如：乾、63、水" value="${escape(search)}"><label><input id="only-favorites" type="checkbox" style="width:auto;margin:0 8px 20px 0">只看收藏</label><div id="detail"></div><div class="catalog" id="catalog"></div>`;catalog();}
else if(route==='practice'){answered=false;app.innerHTML=heading('REVIEW & REFLECT','温故，然后知新','五道基础练习，即时讲解。答错的题目可单独回顾。')+`<p class="muted">待复习错题：${state.wrong.length} 道 <button class="secondary" id="review">复习错题</button></p><div class="card reading" id="quiz"></div>`;quiz();}
else if(route==='notes'){app.innerHTML=heading('MY NOTEBOOK','留下自己的理解','把读到的文字，变成自己的思考。内容自动保存在当前浏览器。')+`<article class="card"><label for="notes">我的学习笔记</label><textarea id="notes" placeholder="今天理解了什么？还有哪些疑问？">${escape(state.notes)}</textarea><p id="save-status" class="muted">${state.notes?'已加载本地笔记':'尚无笔记，写下第一条理解吧。'}</p><button id="export">导出学习记录（JSON）</button><p class="muted">导出包含笔记、完成课程、收藏和练习记录。清除浏览器数据会删除本地记录。</p></article>`;}
else{location.hash='home';return;}}
function catalog(){const only=document.querySelector('#only-favorites').checked;const found=hexagrams.filter(h=>(!only||state.favorites.includes(h.id))&&[h.name,String(h.id),h.upper.name,h.lower.name,h.upper.image,h.lower.image].some(v=>v.includes(search.trim())));document.querySelector('#catalog').innerHTML=found.length?found.map(h=>`<button data-detail="${h.id}"><small>${String(h.id).padStart(2,'0')} ${state.favorites.includes(h.id)?'★':''}</small>${hex(h.bits)}<strong>${h.name}</strong><small>上${h.upper.name} · 下${h.lower.name}</small></button>`).join(''):'<p class="empty">没有匹配的卦象，试试其他关键词。</p>';}
function detail(id){selected=id;const h=hexagrams.find(h=>h.id===id);document.querySelector('#detail').innerHTML=`<article class="card detail"><span class="pill">第 ${h.id} 卦 · 结构学习</span><h2>${h.name}：上${h.upper.name}下${h.lower.name}</h2><p>上卦${h.upper.name}取象为${h.upper.image}，性质为“${h.upper.quality}”；下卦${h.lower.name}取象为${h.lower.image}，性质为“${h.lower.quality}”。这些是《说卦传》中的基本取象，不能仅凭两个取象推出整卦含义。</p><p class="muted">本版未收录此卦完整卦爻辞与注疏；本段是现代结构说明。</p><button data-favorite="${id}">${state.favorites.includes(id)?'★ 取消收藏':'☆ 收藏此卦'}</button> <button class="secondary" data-experiment="${id}">在实验室观察</button></article>`;}
function quiz(){const q=questions[question];answered=false;document.querySelector('#quiz').innerHTML=`<span class="pill">基础练习 ${question+1} / ${questions.length}</span><div class="progress"><i style="width:${(question+1)/questions.length*100}%"></i></div><h2>${q.q}</h2>${q.options.map((o,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="feedback" role="status"></div>`;}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.complete!==undefined){const i=Number(d.complete);if(!state.done.includes(i))state.done.push(i);if(save())notify('本课已完成，继续保持。');render();}if(d.line!==undefined){const i=Number(d.line);bits=bits.slice(0,i)+(bits[i]==='1'?'0':'1')+bits.slice(i+1);render();}if(d.view){selected=Number(d.view);location.hash='library';setTimeout(()=>detail(selected),0);}if(d.detail)detail(Number(d.detail));if(d.favorite){const id=Number(d.favorite);state.favorites=state.favorites.includes(id)?state.favorites.filter(v=>v!==id):[...state.favorites,id];save();catalog();detail(id);}if(d.experiment){bits=hexagrams[Number(d.experiment)-1].bits;location.hash='lab';}if(d.answer!==undefined&&!answered){answered=true;const q=questions[question],ok=Number(d.answer)===q.answer;state.attempts++;if(ok){state.correct++;state.wrong=state.wrong.filter(v=>v!==question);}else if(!state.wrong.includes(question))state.wrong.push(question);save();app.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);document.querySelector('#feedback').innerHTML=`<div class="feedback">${ok?'✓ 回答正确':'再想一想，正确答案是：'+q.options[q.answer]}<br>${q.why}</div><button id="next">${question===questions.length-1?'再来一轮':'下一题 →'}</button>`;}if(b.id==='next'){question=(question+1)%questions.length;quiz();}if(b.id==='review'){if(!state.wrong.length){notify('目前没有待复习错题。');return;}question=state.wrong[0];quiz();}if(b.id==='export'){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='观易-学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
app.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;catalog();}if(e.target.id==='notes'){state.notes=e.target.value;document.querySelector('#save-status').textContent=save()?'已自动保存到当前浏览器':'保存失败，请导出备份';}});
app.addEventListener('change',e=>{if(e.target.id==='only-favorites')catalog();if(['upper','lower'].includes(e.target.id)){bits=document.querySelector('#lower').value+document.querySelector('#upper').value;render();}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();
</script></body></html>
