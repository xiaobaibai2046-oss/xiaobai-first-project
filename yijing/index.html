log button small{display:block;color:var(--muted);margin:7px}.answer{display:block;text-align:left;width:100%;background:transparent;color:var(--ink);border-color:var(--line);margin:12px 0}.feedback{padding:17px;background:#e7ecdf;line-height:1.8;margin:18px 0}.progress{height:5px;background:#e1e3d9;margin:18px 0}.progress i{display:block;height:100%;background:var(--green)}footer{margin-top:55px;padding:24px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.9}#toast{position:fixed;bottom:25px;right:25px;background:var(--green);color:white;padding:12px 20px;border-radius:4px;display:none}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.pill{font-size:11px;color:var(--accent)}.detail{margin-bottom:20px}.empty{padding:30px;color:var(--muted)}@media(min-width:1400px){main{padding:0 75px}}@media(max-width:1000px){aside{width:190px;padding:35px 16px}main{margin-left:190px;padding:0 25px}.grid{grid-template-columns:repeat(2,1fr)}.catalog{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){aside{position:relative;width:100%;padding:20px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:25px}.brand span{display:inline-block;letter-spacing:1px;font-size:9px}.aside-label,.aside-foot{display:none}nav{display:flex;overflow:auto;margin-top:15px;gap:8px}nav a{white-space:nowrap;padding:10px;margin:0;font-size:12px}main{margin:0;padding:0 20px}header{font-size:10px}.badge{font-size:9px}.hero{grid-template-columns:1fr;padding:30px 0 20px}.hero-art{display:none}h1{font-size:31px}.grid,.lab{grid-template-columns:1fr}.catalog{grid-template-columns:repeat(2,1fr)}.stat{padding:15px 10px}.stat strong{font-size:25px}.stat span{font-size:10px}.quote{padding:17px;font-size:20px}.reading p{font-size:16px}}

const classics = [
  {
    "id": 1,
    "title": "乾",
    "judgment": "元亨，利貞。",
    "lines": [
      {
        "label": "初九",
        "text": "潛龍勿用。"
      },
      {
        "label": "九二",
        "text": "見龍在田，利見大人。"
      },
      {
        "label": "九三",
        "text": "君子終日乾乾，夕惕若厲。无咎。"
      },
      {
        "label": "九四",
        "text": "或躍在淵，无咎。"
      },
      {
        "label": "九五",
        "text": "飛龍在天，利見大人。"
      },
      {
        "label": "上九",
        "text": "亢龍，有悔。"
      }
    ],
    "extra": {
      "label": "用九",
      "text": "見群龍无首，吉。"
    },
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_001.txt",
    "sha256": "ce3b0074441a31f2756d7b7c8687e7d25d2cdecb6c97a7c744d2879d7bcc430f"
  },
  {
    "id": 2,
    "title": "坤",
    "judgment": "元亨。利牝馬之貞。君子有攸往，先迷後得主，利，西南得朋，東北喪朋。安貞吉。",
    "lines": [
      {
        "label": "初六",
        "text": "履霜、堅冰至。"
      },
      {
        "label": "六二",
        "text": "直、方、大，不習无不利。"
      },
      {
        "label": "六三",
        "text": "含章可貞，或從王事，无成有終。"
      },
      {
        "label": "六四",
        "text": "括囊，无咎无譽。"
      },
      {
        "label": "六五",
        "text": "黃裳元吉。"
      },
      {
        "label": "上六",
        "text": "龍戰于野，其血玄黃。"
      }
    ],
    "extra": {
      "label": "用六",
      "text": "利永貞。"
    },
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_002.txt",
    "sha256": "aecc28f8cd433f983b5e180f7fbc47afd6a95753df2e0b76bfae3b37c1847b8e"
  },
  {
    "id": 3,
    "title": "屯",
    "judgment": "元亨，利貞。勿用有攸往。利建侯。",
    "lines": [
      {
        "label": "初九",
        "text": "磐桓。利居貞。利建侯。"
      },
      {
        "label": "六二",
        "text": "屯如邅如，乘馬班如。匪寇，婚媾。女子貞不字，十年乃字。"
      },
      {
        "label": "六三",
        "text": "即鹿無虞，惟入于林中，君子幾不如舍，往吝。"
      },
      {
        "label": "六四",
        "text": "乘馬班如，求婚媾。往吉，无不利。"
      },
      {
        "label": "九五",
        "text": "屯其膏，小貞吉，大貞凶。"
      },
      {
        "label": "上六",
        "text": "乘馬班如，泣血漣如。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_003.txt",
    "sha256": "beb830994a19507d9b344d686bc5c627861b7956c3a49f57473204964edc7f2b"
  },
  {
    "id": 4,
    "title": "蒙",
    "judgment": "亨。匪我求童蒙，童蒙來求我。初筮告，再三瀆，瀆則不告。利貞。",
    "lines": [
      {
        "label": "初六",
        "text": "發蒙，利用刑人，用說桎梏，以往吝。"
      },
      {
        "label": "九二",
        "text": "苞蒙，吉。納婦吉。子克家。"
      },
      {
        "label": "六三",
        "text": "勿用取女，見金夫，不有躬。无攸利。"
      },
      {
        "label": "六四",
        "text": "困蒙，吝。"
      },
      {
        "label": "六五",
        "text": "童蒙，吉。"
      },
      {
        "label": "上九",
        "text": "擊蒙，不利為寇，利禦寇。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_004.txt",
    "sha256": "5311e2c1b0256a844504c73d3ee39fbbed30f0e1a59bec846b12ea53e0585067"
  },
  {
    "id": 5,
    "title": "需",
    "judgment": "有孚，光亨。貞吉。利涉大川。",
    "lines": [
      {
        "label": "初九",
        "text": "需于郊，利用恆，无咎。"
      },
      {
        "label": "九二",
        "text": "需于沙，小有言，終吉。"
      },
      {
        "label": "九三",
        "text": "需于泥，致寇至。"
      },
      {
        "label": "六四",
        "text": "需于血，出自穴。"
      },
      {
        "label": "九五",
        "text": "需于酒食，貞吉。"
      },
      {
        "label": "上六",
        "text": "入于穴，有不速之客三人來，敬之終吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_005.txt",
    "sha256": "c4ed7071cbddfae5ef7b9d233a5d794bb22f37ba599f227b7d941e9df6fbedfe"
  },
  {
    "id": 6,
    "title": "訟",
    "judgment": "有孚窒，惕，中吉，終凶。利見大人。不利涉大川。",
    "lines": [
      {
        "label": "初六",
        "text": "不永所事，小有言，終吉。"
      },
      {
        "label": "九二",
        "text": "不克訟，歸而逋其邑，人三百戶无眚。"
      },
      {
        "label": "六三",
        "text": "食舊德，貞厲，終吉。或從王事无成。"
      },
      {
        "label": "九四",
        "text": "不克訟，復即命，渝。安貞吉。"
      },
      {
        "label": "九五",
        "text": "訟元吉。"
      },
      {
        "label": "上九",
        "text": "或錫之鞶、帶，終朝三褫之。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_006.txt",
    "sha256": "2f46d13c523df456809377b2a10359fe4db7c10cbed983ed07112431733da050"
  },
  {
    "id": 7,
    "title": "師",
    "judgment": "貞丈人吉，无咎。",
    "lines": [
      {
        "label": "初六",
        "text": "師出以律，否臧凶。"
      },
      {
        "label": "九二",
        "text": "在師中，吉、无咎，王三錫命。"
      },
      {
        "label": "六三",
        "text": "師或輿尸，凶。"
      },
      {
        "label": "六四",
        "text": "師左次，无咎。"
      },
      {
        "label": "六五",
        "text": "田有禽。利執言，无咎。長子帥師，弟子輿尸，貞凶。"
      },
      {
        "label": "上六",
        "text": "大君有命，開國承家，小人勿用。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_007.txt",
    "sha256": "779e5924ebc6c53707dc610eac68ffe8d1a7b18ac4f5f98d8a88a9b066f532c7"
  },
  {
    "id": 8,
    "title": "比",
    "judgment": "吉。原筮元，永貞无咎。不寧方來，後夫凶。",
    "lines": [
      {
        "label": "初六",
        "text": "有孚比之，无咎。有孚盈缶，終來，有它吉。"
      },
      {
        "label": "六二",
        "text": "比之自內，貞吉。"
      },
      {
        "label": "六三",
        "text": "比之匪人。"
      },
      {
        "label": "六四",
        "text": "外比之，貞吉。"
      },
      {
        "label": "九五",
        "text": "顯比，王用三驅，失前禽，邑人不誡，吉。"
      },
      {
        "label": "上六",
        "text": "比之无首，凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_008.txt",
    "sha256": "9ddc182af90558e3b957e7728a24102905a84bce7ea9ee8ba9b05d66400d8438"
  },
  {
    "id": 9,
    "title": "小畜",
    "judgment": "亨。密雲不雨，自我西郊。",
    "lines": [
      {
        "label": "初九",
        "text": "復自道，何其咎，吉。"
      },
      {
        "label": "九二",
        "text": "牽復，吉。"
      },
      {
        "label": "九三",
        "text": "輿說輻。夫妻反目。"
      },
      {
        "label": "六四",
        "text": "有孚血去惕出，无咎。"
      },
      {
        "label": "九五",
        "text": "有孚攣如，富以其鄰。"
      },
      {
        "label": "上九",
        "text": "既雨既處，尚德載。婦貞厲。月幾望，君子征凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_009.txt",
    "sha256": "fa269d162868f183d4744fcf8a6f249a57312bef5764bb005c22046610144948"
  },
  {
    "id": 10,
    "title": "履",
    "judgment": "履虎尾，不咥人。亨。",
    "lines": [
      {
        "label": "初九",
        "text": "素履往，无咎。"
      },
      {
        "label": "九二",
        "text": "履道坦坦，幽人貞吉。"
      },
      {
        "label": "六三",
        "text": "眇能視，跛能履，履虎尾，咥人凶。武人為于大君。"
      },
      {
        "label": "九四",
        "text": "履虎尾愬愬，終吉。"
      },
      {
        "label": "九五",
        "text": "夬履貞厲。"
      },
      {
        "label": "上九",
        "text": "視履考祥，其旋，元吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_010.txt",
    "sha256": "d6c93349b6011e243843d82ea0de1d32181d85ad24892d0092d2435a9d1a31a6"
  },
  {
    "id": 11,
    "title": "泰",
    "judgment": "小往大來，吉，亨。",
    "lines": [
      {
        "label": "初九",
        "text": "拔茅茹以其彙。征吉。"
      },
      {
        "label": "九二",
        "text": "苞荒，用馮河，不遐遺。朋亡，得尚于中行。"
      },
      {
        "label": "九三",
        "text": "无平不陂，无往不復。艱貞，无咎。勿恤其孚，于食有福。"
      },
      {
        "label": "六四",
        "text": "翩翩，不富以其鄰，不戒以孚。"
      },
      {
        "label": "六五",
        "text": "帝乙歸妹，以祉，元吉。"
      },
      {
        "label": "上六",
        "text": "城復于隍，勿用師，自邑告命、貞吝。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_011.txt",
    "sha256": "851c2b2320f0069c9a7cd71e3a5201432a51ff3d0f6dbbb25ec4c9cb5c201f56"
  },
  {
    "id": 12,
    "title": "否",
    "judgment": "否之匪人。不利君子貞。大往小來。",
    "lines": [
      {
        "label": "初六",
        "text": "拔茅茹，以其彙。貞吉亨。"
      },
      {
        "label": "六二",
        "text": "苞承，小人吉，大人否。亨。"
      },
      {
        "label": "六三",
        "text": "苞羞。"
      },
      {
        "label": "九四",
        "text": "有命，无咎，疇離祉。"
      },
      {
        "label": "九五",
        "text": "休否，大人吉。其亡其亡，繫于苞桑。"
      },
      {
        "label": "上九",
        "text": "傾否，先否後喜。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_012.txt",
    "sha256": "db30ab2d6eb8db39953a12df5649eea7acac527be556cbe2ebb88e00c97be915"
  },
  {
    "id": 13,
    "title": "同人",
    "judgment": "同人于野，亨。利涉大川。利君子貞。",
    "lines": [
      {
        "label": "初九",
        "text": "同人于門，无咎。"
      },
      {
        "label": "六二",
        "text": "同人于宗，吝。"
      },
      {
        "label": "九三",
        "text": "伏戎于莽，升其高陵，三歲不興。"
      },
      {
        "label": "九四",
        "text": "乘其墉，弗克攻，吉。"
      },
      {
        "label": "九五",
        "text": "同人先號咷而後笑，大師克，相遇。"
      },
      {
        "label": "上九",
        "text": "同人于郊，无悔。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_013.txt",
    "sha256": "509bcc32c50aecdee4909b071c511aab709f263e12ba59ce6057afc4017e4ffe"
  },
  {
    "id": 14,
    "title": "大有",
    "judgment": "元亨。",
    "lines": [
      {
        "label": "初九",
        "text": "无交害，匪咎、艱則无咎。"
      },
      {
        "label": "九二",
        "text": "大車以載，有攸往，无咎。"
      },
      {
        "label": "九三",
        "text": "公用亨于天子，小人弗克。"
      },
      {
        "label": "九四",
        "text": "匪其彭，无咎。"
      },
      {
        "label": "六五",
        "text": "厥孚交如，威如吉。"
      },
      {
        "label": "上九",
        "text": "自天祐之，吉无不利。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_014.txt",
    "sha256": "31de6184aa4d3bcb6fd57f7d96c5019eb50a0c4759dda52961a689c84f6fb658"
  },
  {
    "id": 15,
    "title": "謙",
    "judgment": "亨。君子有終。",
    "lines": [
      {
        "label": "初六",
        "text": "謙謙君子，用涉大川，吉。"
      },
      {
        "label": "六二",
        "text": "鳴謙，貞吉。"
      },
      {
        "label": "九三",
        "text": "勞謙，君子有終、吉。"
      },
      {
        "label": "六四",
        "text": "无不利，撝謙。"
      },
      {
        "label": "六五",
        "text": "不富以其鄰，利用侵伐，无不利。"
      },
      {
        "label": "上六",
        "text": "鳴謙，利用行師征邑國。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_015.txt",
    "sha256": "492b3272e9a266c2ff8d8045d03ac5abd0576e79e26fef8d4c5de85786be46e6"
  },
  {
    "id": 16,
    "title": "豫",
    "judgment": "利建侯行師。",
    "lines": [
      {
        "label": "初六",
        "text": "鳴豫，凶。"
      },
      {
        "label": "六二",
        "text": "介于石，不終日，貞吉。"
      },
      {
        "label": "六三",
        "text": "盱豫，悔，遲有悔。"
      },
      {
        "label": "九四",
        "text": "由豫，大有得，勿疑。朋盍簪。"
      },
      {
        "label": "六五",
        "text": "貞疾，恆不死。"
      },
      {
        "label": "上六",
        "text": "冥豫成，有渝、无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_016.txt",
    "sha256": "318d2af66d1c42d5372b691f57953045be7317af5b939b9a13460573e95e6d4d"
  },
  {
    "id": 17,
    "title": "隨",
    "judgment": "元亨，利貞，无咎。",
    "lines": [
      {
        "label": "初九",
        "text": "官有渝，貞吉，出門交有功。"
      },
      {
        "label": "六二",
        "text": "係小子，失丈夫。"
      },
      {
        "label": "六三",
        "text": "係丈夫，失小子，隨有求、得。利居貞。"
      },
      {
        "label": "九四",
        "text": "隨有獲，貞凶。有孚在道，以明，何咎？"
      },
      {
        "label": "九五",
        "text": "孚于嘉、吉。"
      },
      {
        "label": "上六",
        "text": "拘係之乃從，維之，王用亨于西山。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_017.txt",
    "sha256": "0fb0ebf371f1299949266fda19927e273e7e1e024307f5bb070330cf61271891"
  },
  {
    "id": 18,
    "title": "蠱",
    "judgment": "元亨。利涉大川，先甲三日，後甲三日。",
    "lines": [
      {
        "label": "初六",
        "text": "幹父之蠱，有子，考无咎，厲終吉。"
      },
      {
        "label": "九二",
        "text": "幹母之蠱，不可貞。"
      },
      {
        "label": "九三",
        "text": "幹父之蠱，小有悔，无大咎。"
      },
      {
        "label": "六四",
        "text": "裕父之蠱，往見吝。"
      },
      {
        "label": "六五",
        "text": "幹父之蠱，用譽。"
      },
      {
        "label": "上九",
        "text": "不事王侯，高尚其事。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_018.txt",
    "sha256": "43fd6d5cd8f324ee3f606f503af4782896fa75a6ee5696f22d0595826b362945"
  },
  {
    "id": 19,
    "title": "臨",
    "judgment": "元亨，利貞。至于八月有凶。",
    "lines": [
      {
        "label": "初九",
        "text": "咸臨，貞吉。"
      },
      {
        "label": "九二",
        "text": "咸臨吉，无不利。"
      },
      {
        "label": "六三",
        "text": "甘臨，无攸利；既憂之，无咎。"
      },
      {
        "label": "六四",
        "text": "至臨，无咎。"
      },
      {
        "label": "六五",
        "text": "知臨，大君之宜，吉。"
      },
      {
        "label": "上六",
        "text": "敦臨吉，无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_019.txt",
    "sha256": "211a66d87eaa83ac3cfcfc96e8b0e5d46c18bb16d2daf8a5e47f46d5265deab7"
  },
  {
    "id": 20,
    "title": "觀",
    "judgment": "盥而不薦。有孚顒若。",
    "lines": [
      {
        "label": "初六",
        "text": "童觀，小人无咎，君子吝。"
      },
      {
        "label": "六二",
        "text": "闚觀，利女貞。"
      },
      {
        "label": "六三",
        "text": "觀我生進退。"
      },
      {
        "label": "六四",
        "text": "觀國之光，利用賓于王。"
      },
      {
        "label": "九五",
        "text": "觀我生，君子无咎。"
      },
      {
        "label": "上九",
        "text": "觀其生，君子无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_020.txt",
    "sha256": "4b06c9b29dcbf244ffe466f7684035f7a7deb6c8ec8b8f569bf2e069e464229d"
  },
  {
    "id": 21,
    "title": "噬嗑",
    "judgment": "亨。利用獄。",
    "lines": [
      {
        "label": "初九",
        "text": "屨校滅趾，无咎。"
      },
      {
        "label": "六二",
        "text": "噬膚滅鼻，无咎。"
      },
      {
        "label": "六三",
        "text": "噬腊肉遇毒，小吝，无咎。"
      },
      {
        "label": "九四",
        "text": "噬乾胏，得金矢。利艱貞、吉。"
      },
      {
        "label": "六五",
        "text": "噬乾肉，得黃金。貞厲无咎。"
      },
      {
        "label": "上九",
        "text": "何校滅耳，凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_021.txt",
    "sha256": "67381d9f634a844e77de7affda8aacc5e1a9b97267f625f5dfa04c77c2a365f4"
  },
  {
    "id": 22,
    "title": "賁",
    "judgment": "亨。小利有攸往。",
    "lines": [
      {
        "label": "初九",
        "text": "賁其趾，舍車而徒。"
      },
      {
        "label": "六二",
        "text": "賁其須。"
      },
      {
        "label": "九三",
        "text": "賁如濡如，永貞吉。"
      },
      {
        "label": "六四",
        "text": "賁如皤如，白馬翰如，匪寇，婚媾。"
      },
      {
        "label": "六五",
        "text": "賁于丘園，束帛戔戔，吝終吉。"
      },
      {
        "label": "上九",
        "text": "白賁，无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_022.txt",
    "sha256": "386d3f18809d56c0b8281cc1887cad04e9036f920ecc0fdbfb64c8361bdd601f"
  },
  {
    "id": 23,
    "title": "剝",
    "judgment": "不利有攸往。",
    "lines": [
      {
        "label": "初六",
        "text": "剝床以足，蔑貞凶。"
      },
      {
        "label": "六二",
        "text": "剝床以辨，蔑貞凶。"
      },
      {
        "label": "六三",
        "text": "剝之无咎。"
      },
      {
        "label": "六四",
        "text": "剝床以膚，凶。"
      },
      {
        "label": "六五",
        "text": "貫魚以宮人寵，无不利。"
      },
      {
        "label": "上九",
        "text": "碩果不食，君子得輿，小人剝廬。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_023.txt",
    "sha256": "05fdfcdd667a280767841d5067e5e10d0e6ba9ac2eae1c377fd692dcc18c9cfe"
  },
  {
    "id": 24,
    "title": "復",
    "judgment": "亨。出入无疾。朋來无咎。反復其道，七日來復。利有攸往。",
    "lines": [
      {
        "label": "初九",
        "text": "不遠復，无祗悔，元吉。"
      },
      {
        "label": "六二",
        "text": "休復，吉。"
      },
      {
        "label": "六三",
        "text": "頻復，厲、无咎。"
      },
      {
        "label": "六四",
        "text": "中行獨復。"
      },
      {
        "label": "六五",
        "text": "敦復，无悔。"
      },
      {
        "label": "上六",
        "text": "迷復，凶，有災眚。用行師，終有大敗，以其國君凶，至于十年不克征。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_024.txt",
    "sha256": "3770fd411b38de5c8e885b9fd3251d003cb8875051d8748f50a3e7189c5db360"
  },
  {
    "id": 25,
    "title": "无妄",
    "judgment": "元亨，利貞。其匪正有眚，不利有攸往。",
    "lines": [
      {
        "label": "初九",
        "text": "无妄，往吉。"
      },
      {
        "label": "六二",
        "text": "不耕穫；不菑畬；則利有攸往。"
      },
      {
        "label": "六三",
        "text": "无妄之災，或繫之牛，行人之得，邑人之災。"
      },
      {
        "label": "九四",
        "text": "可貞，无咎。"
      },
      {
        "label": "九五",
        "text": "无妄之疾，勿藥有喜。"
      },
      {
        "label": "上九",
        "text": "无妄，行有眚，无攸利。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_025.txt",
    "sha256": "bd3c37f6cf5789c982cc08060040a0dd9645a3437faacbfe001585585f5d1825"
  },
  {
    "id": 26,
    "title": "大畜",
    "judgment": "利貞。不家食吉。利涉大川。",
    "lines": [
      {
        "label": "初九",
        "text": "有厲，利己。"
      },
      {
        "label": "九二",
        "text": "輿說輹。"
      },
      {
        "label": "九三",
        "text": "良馬逐，利艱貞，曰閑輿衛，利有攸往。"
      },
      {
        "label": "六四",
        "text": "童牛之牿，元吉。"
      },
      {
        "label": "六五",
        "text": "豶豕之牙，吉。"
      },
      {
        "label": "上九",
        "text": "何天之衢，亨。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_026.txt",
    "sha256": "29b2c0ca681a6045727b02dc831a3644ff31ddbe5dd5f2e286bb0ea58681c503"
  },
  {
    "id": 27,
    "title": "頤",
    "judgment": "貞吉。觀頤，自求口實。",
    "lines": [
      {
        "label": "初九",
        "text": "舍爾靈龜，觀我朵頤，凶。"
      },
      {
        "label": "六二",
        "text": "顛頤，拂經于丘，頤、征凶。"
      },
      {
        "label": "六三",
        "text": "拂頤貞、凶，十年勿用，无攸利。"
      },
      {
        "label": "六四",
        "text": "顛頤，吉。虎視眈眈，其欲逐逐，无咎。"
      },
      {
        "label": "六五",
        "text": "拂經，居貞、吉，不可涉大川。"
      },
      {
        "label": "上九",
        "text": "由頤，厲、吉。利涉大川。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_027.txt",
    "sha256": "86798a930c4a92658a39f87447a5edcd3636a3a10883d3d6b7b192c8b3060cf5"
  },
  {
    "id": 28,
    "title": "大過",
    "judgment": "棟橈，利有攸往，亨。",
    "lines": [
      {
        "label": "初六",
        "text": "藉用白茅，无咎。"
      },
      {
        "label": "九二",
        "text": "枯楊生稊，老夫得其女妻，无不利。"
      },
      {
        "label": "九三",
        "text": "棟橈，凶。"
      },
      {
        "label": "九四",
        "text": "棟隆、吉。有它、吝。"
      },
      {
        "label": "九五",
        "text": "枯楊生華，老婦得其士夫，无咎无譽。"
      },
      {
        "label": "上六",
        "text": "過涉滅頂，凶。无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_028.txt",
    "sha256": "70bb9bd33de55b6ae4e7b1f69427a0dd3768ae9213260d2ccb77c9296a90d411"
  },
  {
    "id": 29,
    "title": "習坎",
    "judgment": "有孚，維心、亨。行有尚。",
    "lines": [
      {
        "label": "初六",
        "text": "習坎，入于坎窞，凶。"
      },
      {
        "label": "九二",
        "text": "坎有險，求小得。"
      },
      {
        "label": "六三",
        "text": "來之坎坎，險且枕，入于坎窞，勿用。"
      },
      {
        "label": "六四",
        "text": "樽酒、簋貳、用缶，納約自牖，終无咎。"
      },
      {
        "label": "九五",
        "text": "坎不盈，衹既平，无咎。"
      },
      {
        "label": "上六",
        "text": "係用徽纆，寘于叢棘，三歲不得，凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_029.txt",
    "sha256": "66bfb74fae11951975f877f6ce5008fb46851bfb74dfba1074dcca673d3df592"
  },
  {
    "id": 30,
    "title": "離",
    "judgment": "利貞。亨。畜牝牛吉。",
    "lines": [
      {
        "label": "初九",
        "text": "履錯然敬之，无咎。"
      },
      {
        "label": "六二",
        "text": "黃離，元吉。"
      },
      {
        "label": "九三",
        "text": "日昃之離，不鼓缶而歌，則大耋之嗟，凶。"
      },
      {
        "label": "九四",
        "text": "突如、其來如，焚如，死如，棄如。"
      },
      {
        "label": "六五",
        "text": "出涕沱若，戚嗟若，吉。"
      },
      {
        "label": "上九",
        "text": "王用出征，有嘉折首，獲匪其醜，无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_030.txt",
    "sha256": "f75752d317ee50f0bbf2b99875d4a9745901a3c7d960a5620efb3d83e582a391"
  },
  {
    "id": 31,
    "title": "咸",
    "judgment": "亨。利貞。取女吉。",
    "lines": [
      {
        "label": "初六",
        "text": "咸其拇。"
      },
      {
        "label": "六二",
        "text": "咸其腓，凶。居吉。"
      },
      {
        "label": "九三",
        "text": "咸其股，執其隨，往吝。"
      },
      {
        "label": "九四",
        "text": "貞吉。悔亡。憧憧往來，朋從爾思。"
      },
      {
        "label": "九五",
        "text": "咸其脢，无悔。"
      },
      {
        "label": "上六",
        "text": "咸其輔頰舌。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_031.txt",
    "sha256": "58c8b16f8b7e94101a6db3313a8421519f117057d5b447cd21bfee1c4378afb8"
  },
  {
    "id": 32,
    "title": "恆",
    "judgment": "亨。无咎。利貞。利有攸往。",
    "lines": [
      {
        "label": "初六",
        "text": "浚恆，貞凶，无攸利。"
      },
      {
        "label": "九二",
        "text": "悔亡。"
      },
      {
        "label": "九三",
        "text": "不恆其德，或承之羞，貞吝。"
      },
      {
        "label": "九四",
        "text": "田无禽。"
      },
      {
        "label": "六五",
        "text": "恆其德、貞，婦人吉，夫子凶。"
      },
      {
        "label": "上六",
        "text": "振恆，凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_032.txt",
    "sha256": "ce5de9f1e18a64fecfd0f930a879835d9c04302776a1c600b8f92fed077dcb29"
  },
  {
    "id": 33,
    "title": "遯",
    "judgment": "亨。小利貞。",
    "lines": [
      {
        "label": "初六",
        "text": "遯尾、厲，勿用有攸往。"
      },
      {
        "label": "六二",
        "text": "執之用黃牛之革，莫之勝、說。"
      },
      {
        "label": "九三",
        "text": "係遯，有疾厲，畜臣妾吉。"
      },
      {
        "label": "九四",
        "text": "好遯，君子吉，小人否。"
      },
      {
        "label": "九五",
        "text": "嘉遯，貞吉。"
      },
      {
        "label": "上九",
        "text": "肥遯，无不利。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_033.txt",
    "sha256": "23ec703f5c542f5f4e97ab4005a2be9bb65d5aede160ca4ef975353b7127cc37"
  },
  {
    "id": 34,
    "title": "大壯",
    "judgment": "利貞。",
    "lines": [
      {
        "label": "初九",
        "text": "壯于趾，征凶有孚。"
      },
      {
        "label": "九二",
        "text": "貞吉。"
      },
      {
        "label": "九三",
        "text": "小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。"
      },
      {
        "label": "九四",
        "text": "貞吉，悔亡。藩決不羸，壯于大輿之輹。"
      },
      {
        "label": "六五",
        "text": "喪羊于易，无悔。"
      },
      {
        "label": "上六",
        "text": "羝羊觸藩，不能退，不能遂，无攸利，艱則吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_034.txt",
    "sha256": "06abd563a6a498675d191db459ef115f14283d6c347fa25b4b80fef288ace98d"
  },
  {
    "id": 35,
    "title": "晉",
    "judgment": "康侯用錫馬蕃庶，晝日三接。",
    "lines": [
      {
        "label": "初六",
        "text": "晉如摧如，貞吉。罔孚，裕无咎。"
      },
      {
        "label": "六二",
        "text": "晉如，愁如，貞吉。受茲介福于其王母。"
      },
      {
        "label": "六三",
        "text": "眾允，悔亡。"
      },
      {
        "label": "九四",
        "text": "晉如鼫鼠，貞厲。"
      },
      {
        "label": "六五",
        "text": "悔亡，失得勿恤。往吉，无不利。"
      },
      {
        "label": "上九",
        "text": "晉其角，維用伐邑，厲吉，无咎，貞吝。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_035.txt",
    "sha256": "719356fec0d980622ebaef28ff0d4cff715f067b04f2686100cd688f528b2ee2"
  },
  {
    "id": 36,
    "title": "明夷",
    "judgment": "利艱貞。",
    "lines": [
      {
        "label": "初九",
        "text": "明夷于飛，垂其翼。君子于行，三日不食。有攸往，主人有言。"
      },
      {
        "label": "六二",
        "text": "明夷、夷于左股，用拯馬、壯吉。"
      },
      {
        "label": "九三",
        "text": "明夷于南狩，得其大首，不可疾貞。"
      },
      {
        "label": "六四",
        "text": "入于左腹，獲明夷之心于出門庭。"
      },
      {
        "label": "六五",
        "text": "箕子之明夷，利貞。"
      },
      {
        "label": "上六",
        "text": "不明、晦。初登于天，後入于地。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_036.txt",
    "sha256": "33380905a0ec3b463e1c1b5f2054317424ad61e2bc479a03ba58b854b3c6c3c9"
  },
  {
    "id": 37,
    "title": "家人",
    "judgment": "利女貞。",
    "lines": [
      {
        "label": "初九",
        "text": "閑有家，悔亡。"
      },
      {
        "label": "六二",
        "text": "无攸遂，在中饋，貞吉。"
      },
      {
        "label": "九三",
        "text": "家人嗃嗃，悔厲，吉；婦子嘻嘻，終吝。"
      },
      {
        "label": "六四",
        "text": "富家，大吉。"
      },
      {
        "label": "九五",
        "text": "王假有家，勿恤，吉。"
      },
      {
        "label": "上九",
        "text": "有孚威如，終吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_037.txt",
    "sha256": "a087e2001406ef31b51627e570770cc887e810add4dd50677fe951a5e987c806"
  },
  {
    "id": 38,
    "title": "睽",
    "judgment": "小事吉。",
    "lines": [
      {
        "label": "初九",
        "text": "悔亡。喪馬，勿逐自復。見惡人无咎。"
      },
      {
        "label": "九二",
        "text": "遇主于巷，无咎。"
      },
      {
        "label": "六三",
        "text": "見輿曳，其牛掣，其人天且劓，无初有終。"
      },
      {
        "label": "九四",
        "text": "睽孤，遇元夫，交孚，厲无咎。"
      },
      {
        "label": "六五",
        "text": "悔亡。厥宗噬膚，往何咎？"
      },
      {
        "label": "上九",
        "text": "睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇，婚媾。往遇雨，則吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_038.txt",
    "sha256": "900637af3ec7bad7d84ffa83ac744a78f9eda81592ad8fde613c94b4fd00722d"
  },
  {
    "id": 39,
    "title": "蹇",
    "judgment": "利西南，不利東北。利見大人。貞吉。",
    "lines": [
      {
        "label": "初六",
        "text": "往蹇來譽。"
      },
      {
        "label": "六二",
        "text": "王臣蹇蹇，匪躬之故。"
      },
      {
        "label": "九三",
        "text": "往蹇來反。"
      },
      {
        "label": "六四",
        "text": "往蹇來連。"
      },
      {
        "label": "九五",
        "text": "大蹇，朋來。"
      },
      {
        "label": "上六",
        "text": "往蹇，來碩，吉，利見大人。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_039.txt",
    "sha256": "8cdf1e207a2937cec71f88a77ebfcce7191677087d0e307f7a72ba40cb0b596e"
  },
  {
    "id": 40,
    "title": "解",
    "judgment": "利西南。无所往，其來復吉。有攸往，夙吉。",
    "lines": [
      {
        "label": "初六",
        "text": "无咎。"
      },
      {
        "label": "九二",
        "text": "田獲三狐，得黃矢，貞吉。"
      },
      {
        "label": "六三",
        "text": "負且乘，致寇至，貞吝。"
      },
      {
        "label": "九四",
        "text": "解而拇，朋至斯孚。"
      },
      {
        "label": "六五",
        "text": "君子維有解，吉，有孚于小人。"
      },
      {
        "label": "上六",
        "text": "公用射隼于高墉之上，獲之，无不利。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_040.txt",
    "sha256": "4cfe0b5587c84098786ca89467b8b2444a10a43672f109400313bb9e8fe65bae"
  },
  {
    "id": 41,
    "title": "損",
    "judgment": "有孚，元吉，无咎可貞。利有攸往。曷之用，二簋可用享。",
    "lines": [
      {
        "label": "初九",
        "text": "已事遄往，无咎。酌損之。"
      },
      {
        "label": "九二",
        "text": "利貞。征凶，弗損，益之。"
      },
      {
        "label": "六三",
        "text": "三人行則損一人，一人行則得其友。"
      },
      {
        "label": "六四",
        "text": "損其疾，使遄有喜，无咎。"
      },
      {
        "label": "六五",
        "text": "或益之十朋之龜，弗克違，元吉。"
      },
      {
        "label": "上九",
        "text": "弗損，益之，无咎，貞吉，利有攸往，得臣无家。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_041.txt",
    "sha256": "2a0f76a66fc957bf7802c7fe552a066b91537ce7275e58e79b694138b4ba656a"
  },
  {
    "id": 42,
    "title": "益",
    "judgment": "利有攸往。利涉大川。",
    "lines": [
      {
        "label": "初九",
        "text": "利用為大作，元吉，无咎。"
      },
      {
        "label": "六二",
        "text": "或益之，十朋之龜弗克違。永貞吉。王用享于帝，吉。"
      },
      {
        "label": "六三",
        "text": "益之，用凶事无咎。有孚，中行。告公用圭。"
      },
      {
        "label": "六四",
        "text": "中行告公，從，利用為依遷國。"
      },
      {
        "label": "九五",
        "text": "有孚惠心，勿問，元吉。有孚惠我德。"
      },
      {
        "label": "上九",
        "text": "莫益之，或擊之，立心勿恆，凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_042.txt",
    "sha256": "569f7482f545e496a4573ee1aa076817de7fa865bc46e96e337f44e1a1a47740"
  },
  {
    "id": 43,
    "title": "夬",
    "judgment": "揚于王庭，孚號有厲，告自邑。不利即戎，利有攸往。",
    "lines": [
      {
        "label": "初九",
        "text": "壯于前趾，往不勝，為咎。"
      },
      {
        "label": "九二",
        "text": "惕號，莫夜有戎，勿恤。"
      },
      {
        "label": "九三",
        "text": "壯于頄，有凶。君子夬夬，獨行遇雨、若濡，有慍无咎。"
      },
      {
        "label": "九四",
        "text": "臀无膚，其行次且。牽羊悔亡。聞言不信。"
      },
      {
        "label": "九五",
        "text": "莧陸夬夬，中行无咎。"
      },
      {
        "label": "上六",
        "text": "无號，終有凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_043.txt",
    "sha256": "d90f43ed6a79e987d5939a3734fd8ae1d6d707ef01704e78964a8796cd4873e2"
  },
  {
    "id": 44,
    "title": "姤",
    "judgment": "女壯，勿用取女。",
    "lines": [
      {
        "label": "初六",
        "text": "繫于金柅，貞吉。有攸往，見凶，羸豕孚蹢躅。"
      },
      {
        "label": "九二",
        "text": "包有魚，无咎，不利賓。"
      },
      {
        "label": "九三",
        "text": "臀无膚，其行次且，厲，无大咎。"
      },
      {
        "label": "九四",
        "text": "包无魚，起凶。"
      },
      {
        "label": "九五",
        "text": "以杞包瓜，含章，有隕自天。"
      },
      {
        "label": "上九",
        "text": "姤其角，吝，无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_044.txt",
    "sha256": "f8927962081486249097b501e8a1f9073bd931697a4634b03038490b578a503e"
  },
  {
    "id": 45,
    "title": "萃",
    "judgment": "亨，王假有廟。利見大人。亨，利貞，用大牲吉。利有攸往。",
    "lines": [
      {
        "label": "初六",
        "text": "有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎。"
      },
      {
        "label": "六二",
        "text": "引吉，无咎，孚乃利用禴。"
      },
      {
        "label": "六三",
        "text": "萃如嗟如，无攸利，往无咎，小吝。"
      },
      {
        "label": "九四",
        "text": "大吉无咎。"
      },
      {
        "label": "九五",
        "text": "萃有位，无咎。匪孚，元、永貞悔亡。"
      },
      {
        "label": "上六",
        "text": "齎咨涕洟，无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_045.txt",
    "sha256": "b7001ef04b281df6caa6fd286134d5d1613e4e783f9b0e6bb12baddbf61ae947"
  },
  {
    "id": 46,
    "title": "升",
    "judgment": "元亨。用見大人，勿恤。南征吉。",
    "lines": [
      {
        "label": "初六",
        "text": "允升，大吉。"
      },
      {
        "label": "九二",
        "text": "孚乃利用禴，无咎。"
      },
      {
        "label": "九三",
        "text": "升虛邑。"
      },
      {
        "label": "六四",
        "text": "王用亨于岐山，吉，无咎。"
      },
      {
        "label": "六五",
        "text": "貞吉，升階。"
      },
      {
        "label": "上六",
        "text": "冥升，利于不息之貞。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_046.txt",
    "sha256": "7cfed37b07ec5be8ff80193efa5e7fdd773bf1e38157d0df53d0af9604b56a05"
  },
  {
    "id": 47,
    "title": "困",
    "judgment": "亨。貞大人吉，无咎。有言不信。",
    "lines": [
      {
        "label": "初六",
        "text": "臀困于株木，入于幽谷，三歲不覿。"
      },
      {
        "label": "九二",
        "text": "困于酒食，朱紱方來。利用享祀。征凶无咎。"
      },
      {
        "label": "六三",
        "text": "困于石，據于蒺蔾，入于其宮，不見其妻，凶。"
      },
      {
        "label": "九四",
        "text": "來徐徐，困于金車，吝，有終。"
      },
      {
        "label": "九五",
        "text": "劓刖，困于赤紱，乃徐有說，利用祭祀。"
      },
      {
        "label": "上六",
        "text": "困于葛藟，于臲卼，曰動悔有悔，征吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_047.txt",
    "sha256": "208db8c3050409db56b8ca052e0277ec7fdd30ec07ec0da70b0c01aca53d4033"
  },
  {
    "id": 48,
    "title": "井",
    "judgment": "改邑不改井，无喪无得。往來井井。汔至，亦未繘井，羸其瓶，凶。",
    "lines": [
      {
        "label": "初六",
        "text": "井泥不食。舊井无禽。"
      },
      {
        "label": "九二",
        "text": "井谷射鮒，甕敝漏。"
      },
      {
        "label": "九三",
        "text": "井渫不食，為我心惻。可用汲，王明，並受其福。"
      },
      {
        "label": "六四",
        "text": "井甃，无咎。"
      },
      {
        "label": "九五",
        "text": "井洌寒泉，食。"
      },
      {
        "label": "上六",
        "text": "井收勿幕，有孚元吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_048.txt",

  },
  {
    "id": 49,
    "title": "革",
    "judgment": "巳日乃孚。元亨，利貞，悔亡。",
    "lines": [
      {
        "label": "初九",
        "text": "鞏用黃牛之革。"
      },
      {
        "label": "六二",
        "text": "巳日乃革之，征吉，无咎。"
      },
      {
        "label": "九三",
        "text": "征凶。貞厲。革言三就有孚。"
      },
      {
        "label": "九四",
        "text": "悔亡。有孚改命吉。"
      },
      {
        "label": "九五",
        "text": "大人虎變，未占有孚。"
      },
      {
        "label": "上六",
        "text": "君子豹變，小人革面，征凶，居貞吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_049.txt",
    "sha256": "261c9bedf9557403ca68ebe29df88bc27f3efb7f656dc49d8d024aa09987a49f"
  },
  {
    "id": 50,
    "title": "鼎",
    "judgment": "元吉，亨。",
    "lines": [
      {
        "label": "初六",
        "text": "鼎顛趾，利出否。得妾以其子，无咎。"
      },
      {
        "label": "九二",
        "text": "鼎有實，我仇有疾，不我能即，吉。"
      },
      {
        "label": "九三",
        "text": "鼎耳革，其行塞，雉膏不食，方雨，虧悔，終吉。"
      },
      {
        "label": "九四",
        "text": "鼎折足，覆公餗，其形渥，凶。"
      },
      {
        "label": "六五",
        "text": "鼎黃耳金鉉，利貞。"
      },
      {
        "label": "上九",
        "text": "鼎玉鉉，大吉，无不利。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_050.txt",
    "sha256": "3f7d56da704908ccebec0a8eb2ecc02cc2413fd47c0623e2acd19d3386e2bb90"
  },
  {
    "id": 51,
    "title": "震",
    "judgment": "亨。震來虩虩，笑言啞啞，震驚百里，不喪匕鬯。",
    "lines": [
      {
        "label": "初九",
        "text": "「震來虩虩」，後「笑言啞啞」，吉。"
      },
      {
        "label": "六二",
        "text": "震來厲，億喪貝，躋于九陵，勿逐，七日得。"
      },
      {
        "label": "六三",
        "text": "震蘇蘇，震行无眚。"
      },
      {
        "label": "九四",
        "text": "震遂泥。"
      },
      {
        "label": "六五",
        "text": "震往來厲，意无喪有事。"
      },
      {
        "label": "上六",
        "text": "震索索，視矍矍，征凶。震不于其躬、于其鄰、无咎。婚媾有言。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_051.txt",
    "sha256": "16d65107e0f76c0dabd60638505ffece6cfd2fd87112fcb516c390a197ec629d"
  },
  {
    "id": 52,
    "title": "艮",
    "judgment": "其背，不獲其身，行其庭，不見其人，无咎。",
    "lines": [
      {
        "label": "初六",
        "text": "艮其趾，无咎。利永貞。"
      },
      {
        "label": "六二",
        "text": "艮其腓，不拯其隨，其心不快。"
      },
      {
        "label": "九三",
        "text": "艮其限，列其夤，厲薰心。"
      },
      {
        "label": "六四",
        "text": "艮其身，无咎。"
      },
      {
        "label": "六五",
        "text": "艮其輔，言有序，悔亡。"
      },
      {
        "label": "上九",
        "text": "敦艮，吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_052.txt",
    "sha256": "f5885b954e3cee6b02ebd6d609a8a18080de07912c83a230c9b911f67af27a52"
  },
  {
    "id": 53,
    "title": "漸",
    "judgment": "女歸吉。利貞。",
    "lines": [
      {
        "label": "初六",
        "text": "鴻漸于干。小子厲有言，无咎。"
      },
      {
        "label": "六二",
        "text": "鴻漸于磐，飲食衎衎，吉。"
      },
      {
        "label": "九三",
        "text": "鴻漸于陸。夫征不復，婦孕不育，凶。利禦寇。"
      },
      {
        "label": "六四",
        "text": "鴻漸于木，或得其桷，无咎。"
      },
      {
        "label": "九五",
        "text": "鴻漸于陵，婦三歲不孕，終莫之勝，吉。"
      },
      {
        "label": "上九",
        "text": "鴻漸于陸，其羽可用為儀，吉。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_053.txt",
    "sha256": "fba1ec193608148a16f6c11581675e35ef866451b8286c0403bf68e256e207cb"
  },
  {
    "id": 54,
    "title": "歸妹",
    "judgment": "征凶，无攸利。",
    "lines": [
      {
        "label": "初九",
        "text": "歸妹以娣。跛能履，征吉。"
      },
      {
        "label": "九二",
        "text": "眇能視，利幽人之貞。"
      },
      {
        "label": "六三",
        "text": "歸妹以須，反歸以娣。"
      },
      {
        "label": "九四",
        "text": "歸妹愆期，遲歸有時。"
      },
      {
        "label": "六五",
        "text": "帝乙歸妹，其君之袂不如其娣之袂良。月幾望、吉。"
      },
      {
        "label": "上六",
        "text": "女承筐，无實，士刲羊，无血，无攸利。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_054.txt",
    "sha256": "29920309d47abdb40d51ea3f7b4eeaa614f9f5a9e5646a4e2194fc16bcc713c6"

  {
    "id": 55,
    "title": "豐",
    "judgment": "亨，王假之。勿憂，宜日中。",
    "lines": [
      {
        "label": "初九",
        "text": "遇其配主，雖旬无咎，往有尚。"
      },
      {
        "label": "六二",
        "text": "豐其蔀，日中見斗。往得疑疾，有孚，發若吉。"
      },
      {
        "label": "九三",
        "text": "豐其沛，日中見沬，折其右肱，无咎。"
      },
      {
        "label": "九四",
        "text": "豐其蔀，日中見斗，遇其夷主，吉。"
      },
      {
        "label": "六五",
        "text": "來章，有慶譽，吉。"
      },
      {
        "label": "上六",
        "text": "豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_055.txt",
    "sha256": "d57e1afa083166108ac66effd38dac15162983884a58ca887910aa6750cba786"
  },
  {
    "id": 56,
    "title": "旅",
    "judgment": "小亨。旅貞吉。",
    "lines": [
      {
        "label": "初六",
        "text": "旅瑣瑣斯，其所取災。"
      },
      {
        "label": "六二",
        "text": "旅即次，懷其資，得童僕貞。"
      },
      {
        "label": "九三",
        "text": "旅焚其次，喪其童僕貞，厲。"
      },
      {
        "label": "九四",
        "text": "旅于處，得其資斧，我心不快。"
      },
      {
        "label": "六五",
        "text": "射雉一矢亡，終以譽命。"
      },
      {
        "label": "上九",
        "text": "鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_056.txt",
    "sha256": "1864bfabfe52eaee4ea840774f8b89fd7d1ae023a0f6135a8b9bc8dfa386c2ef"
  },
  {
    "id": 57,
    "title": "巽",
    "judgment": "小亨。利有攸往。利見大人。",
    "lines": [
      {
        "label": "初六",
        "text": "進退。利武人之貞。"
      },
      {
        "label": "九二",
        "text": "巽在床下，用史巫、紛若吉、无咎。"
      },
      {
        "label": "九三",
        "text": "頻巽，吝。"
      },
      {
        "label": "六四",
        "text": "悔亡，田獲三品。"
      },
      {
        "label": "九五",
        "text": "貞吉，悔亡，无不利，无初有終。先庚三日，後庚三日，吉。"
      },
      {
        "label": "上九",
        "text": "巽在床下，喪其資斧，貞凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_057.txt",

  },
  {
    "id": 58,
    "title": "兌",
    "judgment": "亨。利貞。",
    "lines": [
      {
        "label": "初九",
        "text": "和兌，吉。"
      },
      {
        "label": "九二",
        "text": "孚兌，吉，悔亡。"
      },
      {
        "label": "六三",
        "text": "來兌，凶。"
      },
      {
        "label": "九四",
        "text": "商兌未寧，介疾有喜。"
      },
      {
        "label": "九五",
        "text": "孚于剝，有厲。"
      },
      {
        "label": "上六",
        "text": "引兌。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_058.txt",
    "sha256": "5eb85036276366c67a5248aaf45fc7b214c71fa77728c005186ccedd4fc58121"
  },
  {
    "id": 59,
    "title": "渙",
    "judgment": "亨。王假有廟。利涉大川，利貞。",
    "lines": [
      {
        "label": "初六",
        "text": "用拯馬壯，吉。"
      },
      {
        "label": "九二",
        "text": "渙奔其机，悔亡。"
      },
      {
        "label": "六三",
        "text": "渙其躬，无悔。"
      },
      {
        "label": "六四",
        "text": "渙其群，元吉。渙有丘，匪夷所思。"
      },
      {
        "label": "九五",
        "text": "渙汗其大號，渙王居，无咎。"
      },
      {
        "label": "上九",
        "text": "渙其血，去逖出，无咎。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_059.txt",
    "sha256": "9f7bfbcbf547bec0938347541df26d41acc3c27a2dce32a83876cd4023be0386"
  },
  {
    "id": 60,
    "title": "節",
    "judgment": "亨。苦節，不可貞。",
    "lines": [
      {
        "label": "初九",
        "text": "不出戶庭，无咎。"
      },
      {
        "label": "九二",
        "text": "不出門庭，凶。"
      },
      {
        "label": "六三",
        "text": "不節若，則嗟若，无咎。"
      },
      {
        "label": "六四",
        "text": "安節。亨。"
      },
      {
        "label": "九五",
        "text": "甘節，吉，往有尚。"
      },
      {
        "label": "上六",
        "text": "苦節，貞凶。悔亡。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_060.txt",
    "sha256": "f47700e18c08adec5ea399d3c17af6d34eb436a63334a088b2a5d17b8f0d9943"
  },
  {
    "id": 61,
    "title": "中孚",
    "judgment": "豚魚，吉。利涉大川，利貞。",
    "lines": [
      {
        "label": "初九",
        "text": "虞吉，有它不燕。"
      },
      {
        "label": "九二",
        "text": "鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。"
      },
      {
        "label": "六三",
        "text": "得敵，或鼓或罷，或泣或歌。"
      },
      {
        "label": "六四",
        "text": "月幾望，馬匹亡，无咎。"
      },
      {
        "label": "九五",
        "text": "有孚攣如，无咎。"
      },
      {
        "label": "上九",
        "text": "翰音登于天，貞凶。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_061.txt",
    "sha256": "27644ab0ac8ab9046ce52756aa9d78ee5a0889800d5431a900dfe090c166cb86"
  },
  {
    "id": 62,
    "title": "小過",
    "judgment": "亨。利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。",
    "lines": [
      {
        "label": "初六",
        "text": "飛鳥以凶。"
      },
      {
        "label": "六二",
        "text": "過其祖，遇其妣。不及其君，遇其臣。无咎。"
      },
      {
        "label": "九三",
        "text": "弗過、防之，從或戕之，凶。"
      },
      {
        "label": "九四",
        "text": "无咎。弗過、遇之，往厲必戒。勿用永貞。"
      },
      {
        "label": "六五",
        "text": "密雲不雨，自我西郊。公弋取彼在穴。"
      },
      {
        "label": "上六",
        "text": "弗遇、過之，飛鳥離之，凶，是謂災眚。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_062.txt",
    "sha256": "8d9e2c4aca8ece3b2d430f0e200eb3166f9749ec17330adec5f8d1259db364bd"
  },
  {
    "id": 63,
    "title": "既濟",
    "judgment": "亨。小利貞。初吉終亂。",
    "lines": [
      {
        "label": "初九",
        "text": "曳其輪，濡其尾，无咎。"
      },
      {
        "label": "六二",
        "text": "婦喪其茀，勿逐，七日得。"
      },
      {
        "label": "九三",
        "text": "高宗伐鬼方，三年克之，小人勿用。"
      },
      {
        "label": "六四",
        "text": "繻有衣袽，終日戒。"
      },
      {
        "label": "九五",
        "text": "東鄰殺牛，不如西鄰之禴祭實受其福。"
      },
      {
        "label": "上六",
        "text": "濡其首，厲。"
      }
    ],
    "extra": null,
    "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_063.txt",
    "sha256": "5cd625c46c875135d6eb0e6b2b10ec64b3a87aae4296bd742271df1d1aa91ff9"
  },
  {
    "id": 64,
    "title": "未濟",
    "judgment": "亨。小狐汔濟，濡其尾，无攸利。",
    "lines": [
      {
        "label": "初六",
        "text": "濡其尾，吝。"
      },
      {
        "label": "九二",
        "text": "曳其輪，貞吉。"
      },
      {
        "label": "六三",
        "text": "未濟，征凶。利涉大川。"
      },
      {
        "label": "九四",
        "text": "貞吉，悔亡，震用伐鬼方，三年，有賞于大國。"
      },
      {
        "label": "六五",
        "text": "貞吉，无悔。君子之光，有孚、吉。"
      },
      {
        "label": "上九",
        "text": "有孚于飲酒，无咎。濡其首，有孚失是。"
      }
    ],

const lessons=[
{title:'先认识《周易》',tag:'起步 · 约 3 分钟',body:'《周易》经文包括六十四卦的卦画、卦辞和爻辞。《易传》是解释经文的一组传文，传统合称“十翼”。学习时先区分经与传，再区分古文原意与后世解读。',quote:'易有太极，是生两仪，两仪生四象，四象生八卦。',source:'《周易·系辞上传》',task:'用自己的话写下：“经文”和“传文”有什么区别？'},
{title:'阴阳与爻：读图的第一步',tag:'基础 · 约 4 分钟',body:'一条完整的横线表示阳爻，一条中间断开的横线表示阴爻。六画卦的爻位从下往上数，依次为初、二、三、四、五、上。阴阳不是简单的好坏标签，应结合具体语境理解。',quote:'一阴一阳之谓道。',source:'《周易·系辞上传》',task:'打开“卦象实验室”，把最下面一爻改变一次，观察卦名是否改变。'},
{title:'八卦：三个爻的八种组合',tag:'基础 · 约 5 分钟',body:'三个爻共有八种阴阳组合。乾、兑、离、震、巽、坎、艮、坤分别常取象为天、泽、火、雷、风、水、山、地。取象帮助理解关系，并不表示一个卦只能对应一种事物。',quote:'乾，健也；坤，顺也；震，动也；巽，入也；坎，陷也；离，丽也；艮，止也；兑，说也。',source:'《周易·说卦传》（“说”通“悦”）',task:'尝试认出乾、坤、坎、离，并画出它们的三爻。'},
{title:'上下卦：组成六十四卦',tag:'进阶 · 约 5 分钟',body:'把两个三画卦上下相重，形成六画卦。下方三爻组成下卦（内卦），上方三爻组成上卦（外卦）。八种上卦乘八种下卦，共有六十四种组合。目录使用通行的文王卦序，它与二进制顺序不同。',quote:'八卦成列，象在其中矣；因而重之，爻在其中矣。',source:'《周易·系辞下传》',task:'将上卦设为坎、下卦设为离，找到第六十三卦“既济”。'},
{title:'怎样阅读一卦',tag:'阅读 · 约 5 分钟',body:'先看卦名与卦画，再读卦辞，最后按爻位读爻辞。“初九”表示初位为阳爻，“六二”表示第二位为阴爻。这里的九、六是传统爻题用数。本软件的结构解说是学习提示，不冒充古代经文或逐卦完整注疏。',quote:'乾：元亨利贞。',source:'《周易》乾卦卦辞（标点为今人所加）',task:'在纯乾卦上，从下往上读出：初九、九二、九三、九四、九五、上九。'},
{title:'变化、处境与学习边界',tag:'应用 · 约 4 分钟',body:'阅读《易经》时可以练习思考变化、位置和行动时机。先提出具体问题，再比较不同处境下行动的条件。避免把模糊的文字直接当作确定结论；现实决策仍需事实与专业知识。此版本以基础学习为主，不提供吉凶预测。',quote:'穷则变，变则通，通则久。',source:'《周易·系辞下传》',task:'记下一件正在变化的事：哪些条件已知？哪些判断还需要证据？'}];
const questions=[{q:'六爻的顺序应该怎样读？',options:['从下往上','从上往下','从中间往两端'],answer:0,why:'初爻在最下方，上爻在最上方。'}, {q:'坎卦的三爻从下往上是？',options:['阳、阴、阳','阴、阳、阴','阳、阳、阴'],answer:1,why:'坎为阴、阳、阴；离为阳、阴、阳。'}, {q:'上坎下离是哪一卦？',options:['未济','泰','既济'],answer:2,why:'既济为上坎下离，通行卦序第 63；未济为上离下坎。'}, {q:'《系辞》属于哪一部分？',options:['《易传》','六十四卦卦辞','六十四卦爻辞'],answer:0,why:'《系辞》分上下篇，是《易传》的组成部分。'}, {q:'两个三画卦上下相重，共有几种组合？',options:['八种','六十四种','三十二种'],answer:1,why:'八种上卦 × 八种下卦 = 六十四卦。'}];

const app=document.querySelector('#app');
let state={done:[],favorites:[],notes:'',wrong:[],attempts:0,correct:0};
try{const saved=JSON.parse(localStorage.getItem('guanyi-v1')||'null');if(saved&&typeof saved==='object'){for(const key of ['done','favorites','wrong'])if(Array.isArray(saved[key]))state[key]=saved[key].filter(Number.isInteger);if(typeof saved.notes==='string')state.notes=saved.notes;for(const key of ['attempts','correct'])if(Number.isFinite(saved[key])&&saved[key]>=0)state[key]=saved[key];}}catch{notify('无法读取本地记录，本次仍可学习。');}
let bits='111111',selected=1,question=0,answered=false,search='';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){const t=document.querySelector('#toast');t.textContent=message;t.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.style.display='none',2800);}
function save(){try{localStorage.setItem('guanyi-v1',JSON.stringify(state));return true;}catch{notify('保存失败，请导出备份；当前记录仅暂存于页面。');return false;}}
function hex(value,interactive=false){return `<div class="hex ${interactive?'large':''}" aria-label="卦象，从下往上为${[...value].map(v=>v==='1'?'阳':'阴').join('、')}">${[...value].map((v,i)=>interactive?`<button class="line ${v==='1'?'yang':''}" data-line="${i}" aria-label="第 ${i+1} 爻：${v==='1'?'阳':'阴'}，点击改变">${v==='0'?'<i></i><i></i>':''}</button>`:`<span class="line ${v==='1'?'yang':''}">${v==='0'?'<i></i><i></i>':''}</span>`).join('')}</div>`;}
function heading(k,title,description){return `<div class="hero"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="muted">${description}</p></div><div class="hero-art" aria-hidden="true">${hex('010101')}</div></div>`;}
function render(){const route=location.hash.slice(1)||'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash.slice(1)===route.split('/')[0]));
if(route==='home'){app.innerHTML=heading('A LITTLE EVERY DAY','每天读懂一点变化','从一阴一阳出发，循序认识《周易》。不急于求答案，先学会看懂卦象。')+`<div class="stats"><div class="stat"><strong>${state.done.length}<small> / 6</small></strong><span>已完成入门课程</span></div><div class="stat"><strong>${state.favorites.length}</strong><span>收藏的卦象</span></div><div class="stat"><strong>${state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—'}</strong><span>练习正确率 · ${state.attempts} 次作答</span></div></div><div class="section-top"><h2>今天，从这里开始</h2><small>每课约 3—5 分钟</small></div><div class="grid"><article class="card"><span class="pill">01 / 循序入门</span><h3>${escape(lessons[Math.max(0,lessons.findIndex((_,i)=>!state.done.includes(i)))].title)}</h3><p class="muted">先建立清晰的基础，再走近古老的文字。</p><a class="button" href="#lessons/${Math.max(0,lessons.findIndex((_,i)=>!state.done.includes(i)))}">继续学习 →</a></article><article class="card"><span class="pill">02 / 动手观察</span><h3>让卦象在指尖变化</h3><p class="muted">改变一爻，观察上下卦与六十四卦的关系。</p><a href="#lab">进入卦象实验室 →</a></article><article class="card"><span class="pill">03 / 温故知新</span><h3>用小练习检验理解</h3><p class="muted">从认爻到识卦，答后解释帮助你记住原理。</p><a href="#practice">开始练习 →</a></article></div><div class="quote">一阴一阳之谓道。<small>《周易·系辞上传》 · 先观察差异，再理解关系。</small></div>`;}
else if(route==='lessons'){app.innerHTML=heading('LEARNING PATH','由浅入深，循序而进','六节入门课，每次掌握一个概念。完成后可以随时回来复习。')+`<div class="grid">${lessons.map((l,i)=>`<article class="card"><span class="pill">${state.done.includes(i)?'✓ 已完成':String(i+1).padStart(2,'0')+' / '+l.tag}</span><h3>${l.title}</h3><p class="muted">${l.body.slice(0,48)}…</p><a href="#lessons/${i}">阅读本课 →</a></article>`).join('')}</div>`;}
else if(route.startsWith('lessons/')){const i=Number(route.split('/')[1]),l=lessons[i];if(!l){location.hash='lessons';return;}app.innerHTML=`<div class="reading"><p><a href="#lessons">← 课程目录</a></p>${heading(l.tag,l.title,'先读一遍，再动手试试。')}<p>${l.body}</p><div class="quote">${l.quote}<small>原文出处：${l.source}</small></div><article class="card"><h3>这一课，试着想一想</h3><p>${l.task}</p><a href="#notes">写下我的理解 →</a></article><p><button data-complete="${i}">${state.done.includes(i)?'✓ 已完成 · 再次复习':'标记本课完成'}</button> ${i<5?`<a class="button" href="#lessons/${i+1}">下一课 →</a>`:'<a class="button" href="#practice">开始练习 →</a>'}</p></div>`;}
else if(route==='lab'){const h=hexagrams.find(h=>h.bits===bits);app.innerHTML=heading('HEXAGRAM LAB','一爻之变，亲手观察','点击任意一爻切换阴阳。最下方为初爻，最上方为上爻。')+`<div class="lab"><article class="card">${hex(bits,true)}<p class="muted" style="text-align:center">↑ 从下向上读爻</p></article><article class="card"><span class="eyebrow">第 ${h.id} 卦</span><h2>${h.name} · 上${h.upper.name}下${h.lower.name}</h2><p>上卦：${h.upper.name}，取象为${h.upper.image}。<br>下卦：${h.lower.name}，取象为${h.lower.image}。</p><div class="controls">${['upper','lower'].map((k,j)=>`<label>${j?'下卦':'上卦'}<select id="${k}">${trigrams.map(t=>`<option value="${t.bits}" ${t.bits===h[k].bits?'selected':''}>${t.name} · ${t.image}</option>`).join('')}</select></label>`).join('')}</div><p class="muted">此处展示卦象结构，不以变爻预测事件。</p><button data-view="${h.id}">查看此卦 →</button></article></div>`;}
else if(route==='library'){app.innerHTML=heading('64 HEXAGRAMS','六十四卦，一览其象','按通行文王卦序排列。完整卦辞与爻辞，按初爻至上爻阅读。支持卦名、卦序和原文检索。')+`<input id="search" aria-label="搜索卦象" placeholder="搜索卦名、卦序或原文，例如：乾、63、潜龙（原文：潛龍）" value="${escape(search)}"><label><input id="only-favorites" type="checkbox" style="width:auto;margin:0 8px 20px 0">只看收藏</label><div id="detail"></div><div class="catalog" id="catalog"></div>`;catalog();}
else if(route==='practice'){answered=false;app.innerHTML=heading('REVIEW & REFLECT','温故，然后知新','五道基础练习，即时讲解。答错的题目可单独回顾。')+`<p class="muted">待复习错题：${state.wrong.length} 道 <button class="secondary" id="review">复习错题</button></p><div class="card reading" id="quiz"></div>`;quiz();}
else if(route==='notes'){app.innerHTML=heading('MY NOTEBOOK','留下自己的理解','把读到的文字，变成自己的思考。内容自动保存在当前浏览器。')+`<article class="card"><label for="notes">我的学习笔记</label><textarea id="notes" placeholder="今天理解了什么？还有哪些疑问？">${escape(state.notes)}</textarea><p id="save-status" class="muted">${state.notes?'已加载本地笔记':'尚无笔记，写下第一条理解吧。'}</p><button id="export">导出学习记录（JSON）</button><p class="muted">导出包含笔记、完成课程、收藏和练习记录。清除浏览器数据会删除本地记录。</p></article>`;}
else{location.hash='home';return;}}
function catalog(){const only=document.querySelector('#only-favorites').checked;const found=hexagrams.filter(h=>(!only||state.favorites.includes(h.id))&&[h.name,String(h.id),h.upper.name,h.lower.name,h.upper.image,h.lower.image,classics[h.id-1].title,classics[h.id-1].judgment,...classics[h.id-1].lines.map(l=>l.text),classics[h.id-1].extra?.text||''].some(v=>v.includes(search.trim())));document.querySelector('#catalog').innerHTML=found.length?found.map(h=>`<button data-detail="${h.id}"><small>${String(h.id).padStart(2,'0')} ${state.favorites.includes(h.id)?'★':''}</small>${hex(h.bits)}<strong>${h.name}</strong><small>上${h.upper.name} · 下${h.lower.name}</small></button>`).join(''):'<p class="empty">没有匹配的卦象，试试其他关键词。</p>';}
function detail(id){selected=id;const h=hexagrams.find(h=>h.id===id),c=classics[id-1];document.querySelector('#detail').innerHTML=`<article class="card detail"><span class="pill">第 ${h.id} 卦 · 经文阅读</span><h2>${h.name}：上${h.upper.name}下${h.lower.name}</h2><div class="controls"><button data-favorite="${id}">${state.favorites.includes(id)?'★ 取消收藏':'☆ 收藏此卦'}</button><button class="secondary" data-experiment="${id}">在实验室观察</button></div><section class="classic-text" aria-label="卦爻辞原文"><h3>卦辞 · 原文</h3><div class="judgment">${escape(c.title)}：${escape(c.judgment)}</div><h3>爻辞 · 从下往上读</h3><ol class="yao-list">${c.lines.map(l=>`<li><strong>${escape(l.label)}</strong><p>${escape(l.text)}</p></li>`).join('')}</ol>${c.extra?`<div class="extra-text"><strong>${escape(c.extra.label)}</strong><p>${escape(c.extra.text)}</p></div>`:''}</section><p class="muted">文本来源：汉籍リポジトリ Kanripo《周易》（KR1a0001，tls）。保留来源繁体字及句读，不同版本可能存在异文和标点差异。<a href="${c.sourceUrl}" target="_blank" rel="noopener noreferrer">查看本卦来源 ↗</a></p><details class="structure-note"><summary>结构说明 · 现代学习提示</summary><p>上卦${h.upper.name}取象为${h.upper.image}，性质为“${h.upper.quality}”；下卦${h.lower.name}取象为${h.lower.image}，性质为“${h.lower.quality}”。这些是《说卦传》中的基本取象，不能仅凭两个取象推出整卦含义。</p><p class="muted">上方为卦爻辞经文，不含《彖》《象》《文言》等传文；本段结构说明由软件编写，非逐句译注。</p></details><div class="controls chapter-nav">${id>1?`<button class="secondary" data-detail="${id-1}">← ${hexagrams[id-2].name}</button>`:''}${id<64?`<button class="secondary" data-detail="${id+1}">${hexagrams[id].name} →</button>`:''}<button class="secondary" data-close-detail="true">返回卦象目录</button></div></article>`;}

function quiz(){const q=questions[question];answered=false;document.querySelector('#quiz').innerHTML=`<span class="pill">基础练习 ${question+1} / ${questions.length}</span><div class="progress"><i style="width:${(question+1)/questions.length*100}%"></i></div><h2>${q.q}</h2>${q.options.map((o,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="feedback" role="status"></div>`;}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.complete!==undefined){const i=Number(d.complete);if(!state.done.includes(i))state.done.push(i);if(save())notify('本课已完成，继续保持。');render();}if(d.line!==undefined){const i=Number(d.line);bits=bits.slice(0,i)+(bits[i]==='1'?'0':'1')+bits.slice(i+1);render();}if(d.view){selected=Number(d.view);location.hash='library';setTimeout(()=>detail(selected),0);}if(d.detail){detail(Number(d.detail));document.querySelector('#detail').scrollIntoView({block:'start'});}if(d.closeDetail){document.querySelector('#detail').innerHTML='';document.querySelector('#search').scrollIntoView({block:'start'});}if(d.favorite){const id=Number(d.favorite);state.favorites=state.favorites.includes(id)?state.favorites.filter(v=>v!==id):[...state.favorites,id];save();catalog();detail(id);}if(d.experiment){bits=hexagrams[Number(d.experiment)-1].bits;location.hash='lab';}if(d.answer!==undefined&&!answered){answered=true;const q=questions[question],ok=Number(d.answer)===q.answer;state.attempts++;if(ok){state.correct++;state.wrong=state.wrong.filter(v=>v!==question);}else if(!state.wrong.includes(question))state.wrong.push(question);save();app.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);document.querySelector('#feedback').innerHTML=`<div class="feedback">${ok?'✓ 回答正确':'再想一想，正确答案是：'+q.options[q.answer]}<br>${q.why}</div><button id="next">${question===questions.length-1?'再来一轮':'下一题 →'}</button>`;}if(b.id==='next'){question=(question+1)%questions.length;quiz();}if(b.id==='review'){if(!state.wrong.length){notify('目前没有待复习错题。');return;}question=state.wrong[0];quiz();}if(b.id==='export'){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='观易-学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
app.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;catalog();}if(e.target.id==='notes'){state.notes=e.target.value;document.querySelector('#save-status').textContent=save()?'已自动保存到当前浏览器':'保存失败，请导出备份';}});
app.addEventListener('change',e=>{if(e.target.id==='only-favorites')catalog();if(['upper','lower'].includes(e.target.id)){bits=document.querySelector('#lower').value+document.querySelector('#upper').value;render();}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();
</script></body></html>
