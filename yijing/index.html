</style></head><body><aside><a class="brand" href="#home">观易<span>YI JING · STUDY</span></a><p class="aside-label">循序而进，观象明理</p><nav aria-label="主导航"><a href="#home">◈ 学习概览</a><a href="#lessons">☷ 入门课程</a><a href="#lab">☰ 卦象实验室</a><a href="#library">▦ 六十四卦</a><a href="#origins">◉ 河洛与源流</a><a href="#commentaries">☷ 易传十翼</a><a href="#practice">✧ 巩固练习</a><a href="#notes">✎ 我的笔记</a></nav><div class="aside-foot">学易，是学习观察变化。<br><small>原典 · 结构 · 思考</small></div></aside><main><header><span>《周易》入门学习手册</span><span class="badge">零基础友好 · 本地保存</span></header><div id="app"></div><footer>原文出处按篇名标注，标点为现代整理；白话说明为本软件编写。基础参考：《周易》经文及《系辞》《说卦》。卦爻辞及十翼传文采用 Kanripo《周易》电子文本，保留繁体字和来源句读。学习记录仅保存在当前浏览器，请定期导出备份。</footer></main><div id="toast" role="status"></div><script type="module">// 数图为常见后世图式的教学重绘；不作为上古实物复原。
const hetuGroups=[{direction:'北',numbers:[1,6],element:'水',note:'一、六居北。传统五行配数称“天一生水，地六成之”。'}, {direction:'南',numbers:[2,7],element:'火',note:'二、七居南。二与七相配，属于后世河图五行解释。'}, {direction:'东',numbers:[3,8],element:'木',note:'三、八居东。三与八相配，属于后世河图五行解释。'}, {direction:'西',numbers:[4,9],element:'金',note:'四、九居西。四与九相配，属于后世河图五行解释。'}, {direction:'中',numbers:[5,10],element:'土',note:'五、十居中。十个数的总和为五十五。'}];
const luoshuSouth=[4,9,2,3,5,7,8,1,6];
const luoshuNorth=[...luoshuSouth].reverse();
const luoshuLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const luoshuDirections={1:'北',2:'西南',3:'东',4:'东南',5:'中',6:'西北',7:'西',8:'东北',9:'南'};
const laterTrigrams={1:'坎 ☵',2:'坤 ☷',3:'震 ☳',4:'巽 ☴',5:'中宫（无卦）',6:'乾 ☰',7:'兑 ☱',8:'艮 ☶',9:'离 ☲'};
const originRevision='8284adbf9e3435d713180e24f05bf75f8b7d1d96';
const originSource=n=>`https://github.com/kanripo/KR1a0001/blob/${originRevision}/KR1a0001_${String(n).padStart(3,'0')}.txt`;
const originQuotes=[{title:'《系辞上传》：图、书的文献线索',text:'河出圖，洛出書，聖人則之。',explanation:'传文提到河图、洛书和圣人取法，但这句话没有画出黑白点阵，也没有说明龙马、神龟负载的情节。因此不能单凭它认定今天的数图就是原初图样。',chapter:'xici-upper',sourceId:65}, {title:'《系辞上传》：天地之数',text:'天一，地二；天三，地四；天五，地六；天七，地八；天九，地十。',explanation:'这一数序是后世河图说的重要解释资源。它列出一至十，但没有在这段话中规定“一六北、二七南”等空间位置。',chapter:'xici-upper',sourceId:65}, {title:'《系辞下传》：观象作卦的传统叙述',text:'古者包犧氏之王天下也，仰則觀象於天，俯則觀法於地，觀鳥獸之文與地之宜，近取諸身，遠取諸物，於是始作八卦，以通神明之德，以類萬物之情。',explanation:'包牺即传统所称伏羲。传文把八卦的起源叙述为观察天地、身心与万物，这属于传统源流叙事，不能直接用作上古作者与年代的考古证明。',chapter:'xici-lower',sourceId:66}, {title:'《说卦传》：八卦方位的依据',text:'帝出乎震，齊乎巽，相見乎離，致役乎坤，說言乎兌，戰乎乾，勞乎坎，成言乎艮。',explanation:'后文进一步说明震东、巽东南、离南、坤西南、兑西、乾西北、坎北、艮东北。后世所谓后天八卦方位以此为重要文献依据；再把这套方位叠加在九宫数上，是后世的对应解释。',chapter:'shuogua',sourceId:67}];
const originTimeline=[{period:'传统起源叙事',title:'伏羲画卦，文王演易',text:'传统常以伏羲画卦、文王演易、周公作爻、孔子传易解释传承。这里的圣人谱系体现文化记忆，不等于每一篇文字均已证实出自对应个人。'}, {period:'经文的形成',title:'卦画、卦辞、爻辞',text:'《周易》经文与古代占筮传统相联系，其材料形成和编纂经历过程。具体年代与作者存在讨论，不能把现存整部书说成某一人一次写成。最初的占筮用途，也不等于现代科学意义的预测验证。'}, {period:'战国至秦汉的思想层累',title:'《易传》解释《周易》',text:'一般研究将《易传》看作战国至秦汉间逐渐形成的多层文本，其具体篇章年代存在争论。经传相结合，让卦爻的解释扩展到阴阳、天地、伦理与变化。'}, {period:'汉代至宋代及以后',title:'象数阐释与图书易学',text:'汉代易学发展象数解释；至宋代，河洛图书之学与先后天八卦图说受到系统发挥。今常见“十数河图、九数洛书”的配名见于朱熹等人的传承体系，历史上也有配名互易与解释分歧。后世图式不能直接当成出土的上古原图。'}];
function originDots(n){return `<span class="origin-dots ${n%2?'odd':'even'}" aria-hidden="true">${'<i></i>'.repeat(n)}</span>`;}
function originsPanel(state){const hetu=state.type==='hetu',south=state.orientation==='south',matrix=south?luoshuSouth:luoshuNorth;
const selected=hetu?hetuGroups.find(g=>g.numbers.includes(state.selected)):null;
const highlighted=hetu?[]:luoshuLines[state.line];

        "title": "咸卦",
        "paragraphs": [
          "《彖》曰：《咸》、感也。柔上而剛下，二氣感應以相與，止而說，男下女，是以「亨利貞、取女吉」也。天地感而萬物化生，聖人感人心而天下和平。觀其所感而天地萬物之情可見矣。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_031.txt"
      },
      {
        "hexId": 32,
        "title": "恆卦",
        "paragraphs": [
          "《彖》曰：《恆》、久也。剛上而柔下。雷風相與。巽而動，剛柔皆應，《恆》。「恆亨无咎利貞」、久於其道也。天地之道恆久而不已也。「利有攸往」、終則有始也。日月得天而能久照，四時變化而能久成。聖人久於其道而天下化成。觀其所恆而天地萬物之情可見矣。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_032.txt"
      },
      {
        "hexId": 33,
        "title": "遯卦",
        "paragraphs": [
          "《彖》曰：《遯》「亨」，遯而亨也。剛當位而應，與時行也。「小利貞」、浸而長也。《遯》之時義大矣哉！"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_033.txt"
      },
      {
        "hexId": 34,
        "title": "大壯卦",
        "paragraphs": [
          "《彖》曰：《大壯》、大者壯也。剛以動，故壯。《大壯》「利貞」，大者、正也。正大而天地之情可見矣。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_034.txt"
      },
      {
        "hexId": 35,
        "title": "晉卦",
        "paragraphs": [
          "《彖》曰：《晉》、進也。明出地上。順而麗乎大明，柔進而上行，是以「康侯」用「錫馬蕃庶晝日三接」也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_035.txt"
      },
      {
        "hexId": 36,
        "title": "明夷卦",
        "paragraphs": [
          "《彖》曰：明入地中，《明夷》。內文明而外柔順，以蒙大難，文王以之。「利艱貞」、晦其明也，內難而能正其志，箕子以之。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_036.txt"
      },
      {
        "hexId": 37,
        "title": "家人卦",
        "paragraphs": [
          "《彖》曰：《家人》，女正位乎內，男正位乎外。男女正，天地之大義也。家人有嚴君焉，父母之謂也。父父、子子、兄兄、弟弟、夫夫、婦婦而家道正，正家而天下定矣。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_037.txt"
      },
      {
        "hexId": 38,
        "title": "睽卦",
        "paragraphs": [
          "《彖》曰：《睽》、火動而上，澤動而下。二女同居，其志不同行。說而麗乎明，柔進而上行，得中而應乎剛，是以「小事吉」。天地睽而其事同也。男女睽而其志通也。萬物睽而其事類也，睽之時用大矣哉！"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_038.txt"
      },
      {
        "hexId": 39,
        "title": "蹇卦",
        "paragraphs": [
          "《彖》曰：《蹇》、難也，險在前也。見險而能止，知矣哉！《蹇》、「利西南」，往得中也，「不利東北」、其道窮也，「利見大人」、往有功也，當位「貞吉」、以正邦也。《蹇》之時用大矣哉！"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_039.txt"
      },
      {
        "hexId": 40,
        "title": "解卦",
        "paragraphs": [
          "《彖》曰：《解》、險以動，動而免乎險，《解》。《解》「利西南」、往得眾也，「其來復吉」、乃得中也。「有攸往夙吉」、往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼。《解》之時大矣哉！"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_040.txt"
      },
      {
        "hexId": 41,
        "title": "損卦",
        "paragraphs": [
          "《彖》曰：《損》、損下益上，其道上行。損而「有孚」，「元吉、无咎、可貞、利有攸往、曷之用二簋、可用享」，二簋應有時。損剛益柔有時，損益盈虛，與時偕行。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_041.txt"
      },
      {
        "hexId": 42,
        "title": "益卦",
        "paragraphs": [
          "《彖》曰：《益》、損上益下，民說无疆。自上下下，其道大光。「利有攸往」、中正有慶，「利涉大川」、木道乃行。《益》動而巽，日進无疆。天施地生，其益无方。凡益之道，與時偕行。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_042.txt"
      },
      {
        "hexId": 43,
        "title": "夬卦",
        "paragraphs": [
          "《彖》曰：《夬》、決也，剛決柔也。健而說，決而和。「揚于王庭」、柔乘五剛也，「孚號有厲」、其危乃光也。「告自邑不利即戎」、所尚乃窮也，「利有攸往」、剛長乃終也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_043.txt"
      },
      {
        "hexId": 44,
        "title": "姤卦",
        "paragraphs": [
          "《彖》曰：《姤》、遇也，柔遇剛也。「勿用取女」、不可與長也。天地相遇，品物咸章也。剛遇中正，天下大行也。《姤》之時義大矣哉！"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_044.txt"
      },
      {
        "hexId": 45,
        "title": "萃卦",
        "paragraphs": [
          "《彖》曰：《萃》、聚也。順以說，剛中而應，故聚也。「王假有廟」、致孝享也，「利見大人亨」、聚以正也，「用大牲吉、利有攸往」、順天命也。觀其所聚而天地萬物之情可見矣。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_045.txt"
      },
      {
        "hexId": 46,
        "title": "升卦",
        "paragraphs": [
          "《彖》曰：柔以時升，巽而順，剛中而應，是以大「亨」。「用見大人勿恤」、有慶也，「南征吉」、志行也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_046.txt"
      },
      {
        "hexId": 47,
        "title": "困卦",
        "paragraphs": [
          "《彖》曰：《困》、剛揜也。險以說，困而不失其所，「亨」，其唯君子乎。「貞大人吉」、以剛中也，「有言不信」、尚口乃窮也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_047.txt"
      },
      {
        "hexId": 48,
        "title": "井卦",
        "paragraphs": [
          "《彖》曰：巽乎水而上水，《井》。井養而不窮也。「改邑不改井」、乃以剛中也。「往來井，井汔至、亦未繘井」、未有功也，「羸其瓶」、是以凶也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_048.txt"
      },
      {
        "hexId": 49,
        "title": "革卦",
        "paragraphs": [
          "《彖》曰：《革》、水火相息，二女同居，其志不相得曰革。「巳日乃孚」，革而信之。文明以說，大「亨」以正。革而當，其「悔」乃「亡」。天地革而四時成，湯武革命，順乎天而應乎人。《革》之時大矣哉！"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_049.txt"
      },
      {
        "hexId": 50,
        "title": "鼎卦",
        "paragraphs": [
          "《彖》曰：《鼎》象也、以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。巽而耳目聰明，柔進而上行，得中而應乎剛，是以「元亨」。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_050.txt"
      },
      {
        "hexId": 51,
        "title": "震卦",
        "paragraphs": [
          "《彖》曰：《震》「亨」。「震來虩虩」、恐致福也，「笑言啞啞」、後有則也，「震驚百里」、驚遠而懼邇也。不喪匕鬯、出可以守宗廟社稷，以為祭主也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_051.txt"
      },
      {
        "hexId": 52,
        "title": "艮卦",
        "paragraphs": [
          "《彖》曰：《艮》、止也。時止則止，時行則行，動靜不失其時，其道光明。艮其止，止其所也。上下敵應，不相與也。是以不獲其身、行其庭不見其人，无咎也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_052.txt"
      },
      {
        "hexId": 53,
        "title": "漸卦",
        "paragraphs": [
          "《彖》曰：《漸》之進也。「女歸吉」也，進得位，往有功也。進以正，可以正邦也。其位、剛得中也。止而巽，動不窮也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_053.txt"
      },
      {
        "hexId": 54,
        "title": "歸妹卦",
        "paragraphs": [
          "《彖》曰：《歸妹》、天地之大義也。天地不交而萬物不興。《歸妹》、人之終始也。說以動，所歸妹也。「征凶」、位不當也，「无攸利」、柔乘剛也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_054.txt"
      },
      {
        "hexId": 55,
        "title": "豐卦",
        "paragraphs": [
          "《彖》曰：《豐》、大也。明以動，故《豐》。「王假之」、尚大也。「勿憂宜日中」、宜照天下也。日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎，況於鬼神乎？"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_055.txt"
      },
      {
        "hexId": 56,
        "title": "旅卦",
        "paragraphs": [
          "《彖》曰：《旅》「小亨」，柔得中乎外而順乎剛，止而麗乎明，是以「小亨旅貞吉」也。旅之時義大矣哉！"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_056.txt"
      },
      {
        "hexId": 57,
        "title": "巽卦",
        "paragraphs": [
          "《彖》曰：重巽以申命。剛巽乎中正而志行。柔皆順乎剛，是以「小亨、利有攸往、利見大人」。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_057.txt"
      },
      {
        "hexId": 58,
        "title": "兌卦",
        "paragraphs": [
          "《彖》曰：《兌》、說也。剛中而柔外。說以「利貞」，是以順乎天而應乎人。說以先民，民忘其勞。說以犯難，民忘其死。說之大，民勸矣哉！"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_058.txt"
      },
      {
        "hexId": 59,
        "title": "渙卦",
        "paragraphs": [
          "《彖》曰：《渙》「亨」，剛來而不窮，柔得位乎外而上同。「王假有廟」、王乃在中也，「利涉大川」、乘木有功也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_059.txt"
      },
      {
        "hexId": 60,
        "title": "節卦",
        "paragraphs": [
          "《彖》曰：《節》「亨」。剛柔分而剛得中。「苦節不可貞」、其道窮也。說以行險，當位以節，中正以通。天地節而四時成。節以制度，不傷財，不害民。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_060.txt"
      },
      {
        "hexId": 61,
        "title": "中孚卦",
        "paragraphs": [
          "《彖》曰：《中孚》、柔在內而剛得中，說而巽，孚，乃化邦也。「豚魚吉」、信及豚魚也，「利涉大川」、乘木舟虛也，中孚以「利貞」、乃應乎天也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_061.txt"
      },
      {
        "hexId": 62,
        "title": "小過卦",
        "paragraphs": [
          "《彖》曰：《小過》「亨」、小者過而亨也。過以「利貞」、與時行也。柔得中，是以「小事吉」也。剛失位而不中，是以「不可大事」也。有「飛鳥」之象焉，「飛鳥遺之音、不宜上、宜下、大吉」、上逆而下順也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_062.txt"
      },
      {
        "hexId": 63,
        "title": "既濟卦",
        "paragraphs": [
          "《彖》曰：《既濟》「亨」，小者亨也。「利貞」。剛柔正而位當也。「初吉」、柔得中也。「終」止則「亂」，其道窮也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_063.txt"
      },
      {
        "hexId": 64,
        "title": "未濟卦",
        "paragraphs": [
          "《彖》曰：《未濟》「亨」、柔得中也。「小狐汔濟」、未出中也。「濡其尾、无攸利」、不續終也。雖不當位、剛柔應也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_064.txt"
      }
    ]
  },
  {
    "key": "xiang-upper",
    "title": "象传上",
    "intro": "包含大象及小象：分别解释卦象与爻义。乾卦的大小象在来源中合为一段，保留原样。",
    "entries": [
      {
        "hexId": 1,
        "title": "乾卦",
        "paragraphs": [
          "《象》曰：天行健，君子以自強不息。「潛龍勿用」、陽在下也。「見龍在田」、德施普也。「終日乾乾」、反復道也。「或躍在淵」、進「无咎」也。「飛龍在天」、「大人」造也。「亢龍有悔」、盈不可久也。「用九」、天德不可為首也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_001.txt"
      },
      {
        "hexId": 2,
        "title": "坤卦",
        "paragraphs": [
          "《象》曰：地勢坤。君子以厚德載物。",
          "《象》曰：「履霜堅冰」、陰始凝也。馴致其道，至「堅冰」也。",
          "《象》曰：六二之動、「直」以「方」也，「不習无不利」、地道光也。",
          "《象》曰：「含章可貞」、以時發也。「或從王事」、知光大也。",
          "《象》曰：「括囊无咎」、慎不害也。",
          "《象》曰：「黃裳元吉」、文在中也。",
          "《象》曰：「龍戰于野」，其道窮也。",
          "《象》曰：「用六永貞」，以大終也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_002.txt"
      },
      {
        "hexId": 3,
        "title": "屯卦",
        "paragraphs": [
          "《象》曰：雲雷、屯。君子以經綸。",
          "《象》曰：雖「磐桓」，志行正也。以貴下賤，大得民也。",
          "《象》曰：六二之難、乘剛也，「十年乃字」、反常也。",
          "《象》曰：「即鹿无虞」以從禽也。「君子舍」之，「往吝」窮也。",
          "《象》曰：「求」而「往」、明也。",
          "《象》曰：「屯其膏」、施未光也。",
          "《象》曰：「泣血漣如」，何可長也？"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_003.txt"
      },
      {
        "hexId": 4,
        "title": "蒙卦",
        "paragraphs": [
          "《象》曰：山下出泉，《蒙》。君子以果行育德。",
          "《象》曰：「利用刑人」、以正法也。",
          "《象》曰：「子克家」、剛柔接也。",
          "《象》曰：「勿用取女」、行不順也。",
          "《象》曰：「困蒙」之「吝」、獨遠實也。",
          "《象》曰：「童蒙」之吉、順以巽也。",
          "《象》曰：「利」用「禦寇」，上下順也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_004.txt"
      },
      {
        "hexId": 5,
        "title": "需卦",
        "paragraphs": [
          "《象》曰：雲上於天，《需》。君子以飲食宴樂。",
          "《象》曰：「需于郊」、不犯難行也。「利用恆无咎」、未失常也。",
          "《象》曰：「需于沙」、行在中也。雖「小有言」、以「吉」「終」也。",
          "《象》曰：「需于泥」、災在外也。自我「致寇」、敬慎不敗也。",
          "《象》曰：「需于血」、順以聽也。",
          "《象》曰：「酒食貞吉」、以中正也。",
          "《象》曰：「不速之客來、敬之終吉」也，雖不當位，未大失也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_005.txt"
      },
      {
        "hexId": 6,
        "title": "訟卦",
        "paragraphs": [
          "《象》曰：天與水違行，《訟》。君子以作事謀始。",
          "《象》曰：「不永所事」、訟不可長也。雖「小有言」、其辯明也。",
          "《象》曰：「不克訟」、「歸逋」竄也。自下訟上，患至掇也。",
          "《象》曰：「食舊德」、從上「吉」也。",
          "《象》曰：「復即命、渝」、「安貞」不失也。",
          "《象》曰：「訟元吉」、以中正也。",
          "《象》曰：以訟受服、亦不足敬也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_006.txt"
      },
      {
        "hexId": 7,
        "title": "師卦",
        "paragraphs": [
          "《象》曰：地中有水，《師》。君子以容民畜眾。",
          "《象》曰：「師出以律」，失律「凶」也。",
          "《象》曰：「在師中吉」、承天寵也，「王三錫命」、懷萬邦也。",
          "《象》曰：「師或輿尸」、大无功也。",
          "《象》曰：「左次无咎」、未失常也。",
          "《象》曰：「長子帥師」、以中行也，「弟子輿尸」、使不當也。",
          "《象》曰：「大君有命」、以正功也，「小人勿用」、必亂邦也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_007.txt"
      },
      {
        "hexId": 8,
        "title": "比卦",
        "paragraphs": [
          "《象》曰：地上有水，《比》。先王以建萬國，親諸侯。",
          "《象》曰：《比》之初六、「有它吉」也。",
          "《象》曰：「比之自內」、不自失也。",
          "《象》曰：「比之匪人」、不亦傷乎？",
          "《象》曰：「外比」於賢、以從上也。",
          "《象》曰：「顯比」之「吉」、位正中也，舍逆取順、「失前禽」也，「邑人不誡」、上使中也。",
          "《象》曰：「比之无首」、无所終也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_008.txt"
      },
      {
        "hexId": 9,
        "title": "小畜卦",
        "paragraphs": [
          "《象》曰：風行天上，《小畜》。君子以懿文德。",
          "《象》曰：「復自道」、其義「吉」也。",
          "《象》曰：「牽復」在中、亦不自失也。",
          "《象》曰：「夫妻反目」、不能正室也。",
          "《象》曰：「有孚惕出」、上合志也。",
          "《象》曰：「有孚攣如」、不獨富也。",
          "《象》曰：「既雨既處」、「德」積「載」也。「君子征凶」、有所疑也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_009.txt"
      },
      {
        "hexId": 10,
        "title": "履卦",
        "paragraphs": [
          "《象》曰：上天下澤，《履》。君子以辯上下，定民志。",
          "《象》曰：「素履」之「往」、獨行願也。",
          "《象》曰：「幽人貞吉」、中不自亂也。",
          "《象》曰：「眇能視」、不足以有明也，「跛能履」、不足以與行也。「咥人」之「凶」、位不當也，「武人為于大君」、志剛也。",
          "《象》曰：「愬愬終吉」、志行也。",
          "《象》曰：「夬履貞厲」、位正當也。",
          "《象》曰：「元吉」在上、大有慶也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_010.txt"
      },
      {
        "hexId": 11,
        "title": "泰卦",
        "paragraphs": [
          "《象》曰：天地交，《泰》。后以財成天地之道，輔相天地之宜，以左右民。",
          "《象》曰：「拔茅征吉」、志在外也。",
          "《象》曰：「苞荒、得尚于中行」，以光大也。",
          "《象》曰：「无往不復」、天地際也。",
          "《象》曰：「翩翩不富」、皆失實也，「不戒以孚」、中心願也。",
          "《象》曰：「以祉元吉」、中以行願也。",
          "《象》曰：「城復于隍」、其命亂也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_011.txt"
      },
      {
        "hexId": 12,
        "title": "否卦",
        "paragraphs": [
          "《象》曰：天地不交，《否》。君子以儉德辟難，不可榮以祿。",
          "《象》曰：「拔茅貞吉」、志在君也。",
          "《象》曰：「大人否亨」、不亂群也。",
          "《象》曰：「苞羞」、位不當也。",
          "《象》曰：「有命无咎」、志行也。",
          "《象》曰：「大人」之「吉」、位正當也。",
          "《象》曰：「否」終則「傾」、何可長也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_012.txt"
      },
      {
        "hexId": 13,
        "title": "同人卦",
        "paragraphs": [
          "《象》曰：天與火、《同人》。君子以類族辨物。",
          "《象》曰：「出門同人」，又誰「咎」也。",
          "《象》曰：「同人于宗」、「吝」道也。",
          "《象》曰：「伏戎于莽」、敵剛也，「三歲不興」、安行也。",
          "《象》曰：「乘其墉」、義「弗克」也。其「吉」、則困而反則也。",
          "《象》曰：「同人」之「先」以中直也。「大師相遇」、言相「克」也。",
          "《象》曰：「同人于郊」、志未得也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_013.txt"
      },
      {
        "hexId": 14,
        "title": "大有卦",
        "paragraphs": [
          "《象》曰：火在天上，《大有》。君子以遏惡揚善，順天休命。",
          "《象》曰：《大有》初九，无交害也。",
          "《象》曰：「大車以載」、積中不敗也。",
          "《象》曰：「公用亨于天子」、「小人」害也。",
          "《象》曰：「匪其彭、无咎」、明辯晢也。",
          "《象》曰：「厥孚交如」、信以發志也，「威如」之「吉」、易而无備也。",
          "《象》曰：《大有》上「吉」、「自天祐」也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_014.txt"
      },
      {
        "hexId": 15,
        "title": "謙卦",
        "paragraphs": [
          "《象》曰：地中有山，《謙》。君子以裒多益寡，稱物平施。",
          "《象》曰：「謙謙君子」、卑以自牧也。",
          "《象》曰：「鳴謙貞吉」、中心得也。",
          "《象》曰：「勞謙君子」、萬民服也。",
          "《象》曰：「无不利、撝謙」、不違則也。",
          "《象》曰：「利用侵伐」、征不服也。",
          "《象》曰：「鳴謙」、志未得也。可「用行師」、征邑國也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_015.txt"
      },
      {
        "hexId": 16,
        "title": "豫卦",
        "paragraphs": [
          "《象》曰：雷出地奮，《豫》。先王以作樂崇德，殷薦之上帝以配祖考。",
          "《象》曰：「初六鳴豫」、志窮「凶」也。",
          "《象》曰：「不終日貞吉」、以中正也。",
          "《象》曰：「盱豫有悔」、位不當也。",
          "《象》曰：「由豫大有得」、志大行也。",
          "《象》曰：「六五貞疾」、乘剛也，「恆不死」、中未亡也。",
          "《象》曰：「冥豫」在「上」、何可長也？"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_016.txt"
      },
      {
        "hexId": 17,
        "title": "隨卦",
        "paragraphs": [
          "《象》曰：澤中有雷，《隨》。君子以嚮晦入宴息。",
          "《象》曰：「官有渝」、從正「吉」也，「出門交有功」、不失也。",
          "《象》曰：「係小子」、弗兼與也。",
          "《象》曰：「係丈夫」、志舍下也。",
          "《象》曰：「隨有獲」、其義「凶」也，「有孚在道」、「明」功也。",
          "《象》曰：「孚于嘉吉」、位正中也。",
          "《象》曰：「拘係之」、上窮也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_017.txt"
      },
      {
        "hexId": 18,
        "title": "蠱卦",
        "paragraphs": [
          "《象》曰：山下有風，《蠱》。君子以振民育德。",
          "《象》曰：「幹父之蠱」、意承「考」也。",
          "《象》曰：「幹母之蠱」、得中道也。",
          "《象》曰：「幹父之蠱」、終「无咎」也。",
          "《象》曰：「裕父之蠱」、往未得也。",
          "《象》曰：「幹父用譽」、承以德也。",
          "《象》曰：「不事王侯」、志可則也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_018.txt"
      },
      {
        "hexId": 19,
        "title": "臨卦",
        "paragraphs": [
          "《象》曰：澤上有地，《臨》。君子以教思无窮，容保民无疆。",
          "《象》曰：「咸臨貞吉」、志行正也。",
          "《象》曰：「咸臨吉无不利」、未順命也。",
          "《象》曰：「甘臨」、位不當也，「既憂之」、「咎」不長也。",
          "《象》曰：「至臨无咎」、位當也。",
          "《象》曰：「大君之宜」、行中之謂也。",
          "《象》曰：「敦臨」之「吉」、志在內也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_019.txt"
      },
      {
        "hexId": 20,
        "title": "觀卦",
        "paragraphs": [
          "《象》曰：風行地上，《觀》。先王以省方觀民設教。",
          "《象》曰：「初六童觀」、「小人」道也。",
          "《象》曰：「闚觀女貞」、亦可醜也。",
          "《象》曰：「觀我生進退」、未失道也。",
          "《象》曰：「觀國之光」、尚「賓」也。",
          "《象》曰：「觀我生」、觀民也。",
          "《象》曰：「觀其生」、志未平也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_020.txt"
      },
      {
        "hexId": 21,
        "title": "噬嗑卦",
        "paragraphs": [
          "《象》曰：雷電《噬嗑》。先王以明罰勑法。",
          "《象》曰：「屨校滅趾」、不行也。",
          "《象》曰：「噬膚滅鼻」、乘剛也。",
          "《象》曰：「遇毒」、位不當也。",
          "《象》曰：「利艱貞吉」、未光也。",
          "《象》曰：「貞厲无咎」、得當也。",
          "《象》曰：「何校滅耳」、聰不明也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_021.txt"
      },
      {
        "hexId": 22,
        "title": "賁卦",
        "paragraphs": [
          "《象》曰：山下有火，《賁》。君子以明庶政，无敢折獄。",
          "《象》曰：「舍車而徒」、義弗乘也。",
          "《象》曰：「賁其須」、與上興也。",
          "《象》曰：「永貞」之「吉」、終莫之陵也。",
          "《象》曰：「六四」、當位疑也，「匪寇婚媾」、終无尤也。",
          "《象》曰：「六五」之「吉」、有喜也。",
          "《象》曰：「白賁无咎」、上得志也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_022.txt"
      },
      {
        "hexId": 23,
        "title": "剝卦",
        "paragraphs": [
          "《象》曰：山附於地，《剝》。上以厚下安宅。",
          "《象》曰：「剝床以足」、以滅下也。",
          "《象》曰：「剝床以辨」、未有與也。",
          "《象》曰：「剝之无咎」、失上下也。",
          "《象》曰：「剝床以膚」、切近災也。",
          "《象》曰：「以宮人寵」、終无尤也。",
          "《象》曰：「君子得輿」、民所載也，「小人剝廬」、終不可用也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_023.txt"
      },
      {
        "hexId": 24,
        "title": "復卦",
        "paragraphs": [
          "《象》曰：雷在地中，《復》。先王以至日閉關，商旅不行，后不省方。",
          "《象》曰：「不遠」之「復」、以脩身也。",
          "《象》曰：「休復」之「吉」、以下仁也。",
          "《象》曰：「頻復」之「厲」、義「无咎」也。",
          "《象》曰：「中行獨復」、以從道也。",
          "《象》曰：「敦復无悔」、中以自考也。",
          "《象》曰：「迷復」之「凶」、反君道也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_024.txt"
      },
      {
        "hexId": 25,
        "title": "无妄卦",
        "paragraphs": [
          "《象》曰：天下雷行，物與《无妄》。先王以茂對時育萬物。",
          "《象》曰：「无妄」之「往」、得志也。",
          "《象》曰：「不耕穫」、未富也。",
          "《象》曰：「行人得」牛、「邑人災」也。",
          "《象》曰：「可貞无咎」、固有之也。",
          "《象》曰：「无妄」之「藥」、不可試也。",
          "《象》曰：「无妄」之「行」、窮之災也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_025.txt"
      },
      {
        "hexId": 26,
        "title": "大畜卦",
        "paragraphs": [
          "《象》曰：天在山中，《大畜》。君子以多識前言往行以畜其德。",
          "《象》曰：「有厲利己」、不犯災也。",
          "《象》曰：「輿說輹」、中无尤也。",
          "《象》曰：「利有攸往」、上合志也。",
          "《象》曰：「六四元吉」、有喜也。",
          "《象》曰：「六五」之「吉」、有慶也。",
          "《象》曰：「何天之衢」、道大行也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_026.txt"
      },
      {
        "hexId": 27,
        "title": "頤卦",
        "paragraphs": [
          "《象》曰：山下有雷，《頤》。君子以慎言語、節飲食。",
          "《象》曰：「觀我朵頤」、亦不足貴也。",
          "《象》曰：「六二征凶」、行失類也。",
          "《象》曰：「十年勿用」、道大悖也。",
          "《象》曰：「顛頤」之「吉」、上施光也。",
          "《象》曰：「居貞」之「吉」、順以從上也。",
          "《象》曰：「由頤厲吉」、大有慶也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_027.txt"
      },
      {
        "hexId": 28,
        "title": "大過卦",
        "paragraphs": [
          "《象》曰：澤滅木，《大過》。君子以獨立不懼，遯世无悶。",
          "《象》曰：「藉用白茅」、柔在下也。",
          "《象》曰：「老夫女妻」、過以相與也。",
          "《象》曰：「棟橈」之「凶」、不可以有輔也。",
          "《象》曰：「棟隆」之「吉」、不橈乎下也。",
          "《象》曰：「枯楊生華」、何可久也，「老婦士夫」、亦可醜也。",
          "《象》曰：「過涉」之「凶」、不可咎也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_028.txt"
      },
      {
        "hexId": 29,
        "title": "習坎卦",
        "paragraphs": [
          "《象》曰：水洊至，《習坎》。君子以常德行、習教事。",
          "《象》曰：「習坎入坎」、失道「凶」也。",
          "《象》曰：「求小得」、未出中也。",
          "《象》曰：「來之坎坎」、終无功也。",
          "《象》曰：「樽酒簋貳」、剛柔際也。",
          "《象》曰：「坎不盈」、中未大也。",
          "《象》曰：「上六」失道、「凶」「三歲」也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_029.txt"
      },
      {
        "hexId": 30,
        "title": "離卦",
        "paragraphs": [
          "《象》曰：明兩、作《離》。大人以繼明照于四方。",
          "《象》曰：「履錯」之「敬」、以辟咎也。",
          "《象》曰：「黃離元吉」、得中道也。",
          "《象》曰：「日昃之離」、何可久也？",
          "《象》曰：「突如其來如」、无所容也。",
          "《象》曰：「六五」之「吉」、離王公也。",
          "《象》曰：「王用出征」、以正邦也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_030.txt"
      }
    ]
  },
  {
    "key": "xiang-lower",
    "title": "象传下",
    "intro": "包含大象及小象：分别解释卦象与爻义。乾卦的大小象在来源中合为一段，保留原样。",
    "entries": [
      {
        "hexId": 31,
        "title": "咸卦",
        "paragraphs": [
          "《象》曰：山上有澤，《咸》。",
          "君子以虛受人。",
          "《象》曰：「咸其拇」、志在外也。",
          "《象》曰：雖「凶居吉」、順不害也。",
          "《象》曰：「咸其股」、亦不處也，志在「隨」人、所「執」下也。",
          "《象》曰：「貞吉悔亡」、未感害也，「憧憧往來」、未光大也。",
          "《象》曰：「咸其脢」、志末也。",
          "《象》曰：「咸其輔頰舌」、滕口說也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_031.txt"
      },
      {
        "hexId": 32,
        "title": "恆卦",
        "paragraphs": [
          "《象》曰：雷風《恆》。君子以立不易方。",
          "《象》曰：「浚恆」之「凶」、始求深也。",
          "《象》曰：「九二悔亡」、能久中也。",
          "《象》曰：「不恆其德」、无所容也。",
          "《象》曰：久非其位，安得「禽」也。",
          "《象》曰：「婦人貞吉」、從一而終也。「夫子」制義、從婦「凶」也。",
          "《象》曰：「振恆」在上、大无功也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_032.txt"
      },
      {
        "hexId": 33,
        "title": "遯卦",
        "paragraphs": [
          "《象》曰：天下有山，《遯》。君子以遠小人，不惡而嚴。",
          "《象》曰：「遯尾」之「厲」、不往何災也？",
          "《象》曰：「執用黃牛」、固志也。",
          "《象》曰：「係遯」之「厲」、有疾憊也，「畜臣妾吉」、不可大事也。",
          "《象》曰：「君子好遯、小人否」也。",
          "《象》曰：「嘉遯貞吉」、以正志也。",
          "《象》曰：「肥遯无不利」、无所疑也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_033.txt"
      },
      {
        "hexId": 34,
        "title": "大壯卦",
        "paragraphs": [
          "《象》曰：雷在天上，《大壯》。君子以非禮弗履。",
          "《象》曰：「壯于趾」、其「孚」窮也。",
          "《象》曰：「九二貞吉」、以中也。",
          "《象》曰：「小人用壯、君子用罔」也。",
          "《象》曰：「藩決不羸」、尚往也。",
          "《象》曰：「喪羊于易」、位不當也。",
          "《象》曰：「不能退、不能遂」、不詳也，「艱則吉」、咎不長也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_034.txt"
      },
      {
        "hexId": 35,
        "title": "晉卦",
        "paragraphs": [
          "《象》曰：明出地上，《晉》。君子以自昭明德。",
          "《象》曰：「晉如摧如」、獨行正也，「裕无咎」、未受命也。",
          "《象》曰：「受茲介福」、以中正也。",
          "《象》曰：「眾允」之、志上行也。",
          "《象》曰：「鼫鼠貞厲」、位不當也。",
          "《象》曰：「失得勿恤」、往有慶也。",
          "《象》曰：「維用伐邑」、道未光也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_035.txt"
      },
      {
        "hexId": 36,
        "title": "明夷卦",
        "paragraphs": [
          "《象》曰：明入地中，《明夷》。君子以莅眾用晦而明。",
          "《象》曰：「君子于行」、義「不食」也。",
          "《象》曰：「六二」之「吉」、順以則也。",
          "《象》曰：「南狩」之志、乃大得也。",
          "《象》曰：「入于左腹」、獲心意也。",
          "《象》曰：「箕子」之「貞」、「明」不可息也。",
          "《象》曰：「初登于天」、照四國也，「後入于地」、失則也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_036.txt"
      },
      {
        "hexId": 37,
        "title": "家人卦",
        "paragraphs": [
          "《象》曰：風自火出，《家人》。君子以言有物而行有恆。",
          "《象》曰：「閑有家」、志未變也。",
          "《象》曰：「六二」之「吉」、順以巽也。",
          "《象》曰：「家人嗃嗃」、未失也，「婦子嘻嘻」、失家節也。",
          "《象》曰：「富家大吉」、順在位也。",
          "《象》曰：「王假有家」、交相愛也。",
          "《象》曰：「威如」之「吉」、反身之謂也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_037.txt"
      },
      {
        "hexId": 38,
        "title": "睽卦",
        "paragraphs": [
          "《象》曰：上火下澤，《睽》。君子以同而異。",
          "《象》曰：「見惡人」、以辟「咎」也。",
          "《象》曰：「遇主于巷」、未失道也。",
          "《象》曰：「見輿曳」、位不當也，「无初有終」、遇剛也。",
          "《象》曰：「交孚无咎」、志行也。",
          "《象》曰：「厥宗噬膚」、「往」有慶也。",
          "《象》曰：「遇雨」之「吉」、群疑亡也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_038.txt"
      },
      {
        "hexId": 39,
        "title": "蹇卦",
        "paragraphs": [
          "《象》曰：山上有水，《蹇》。君子以反身修德。",
          "《象》曰：「往蹇來譽」、宜待也。",
          "《象》曰：「王臣蹇蹇」、終无尤也。",
          "《象》曰：「往蹇來反」、內喜之也。",
          "《象》曰：「往蹇來連」、當位實也。",
          "《象》曰：「大蹇朋來」、以中節也。",
          "《象》曰：「往蹇來碩」、志在內也，「利見大人」、以從貴也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_039.txt"
      },
      {
        "hexId": 40,
        "title": "解卦",
        "paragraphs": [
          "《象》曰：雷雨作，《解》。君子以赦過宥罪。",
          "《象》曰：剛柔之際，義「无咎」也。",
          "《象》曰：「九二」「貞吉」、得中道也。",
          "《象》曰：「負且乘」、亦可醜也。自我致戎，又誰咎也？",
          "《象》曰：「解而拇」、未當位也。",
          "《象》曰：「君子有解」、「小人」退也。",
          "《象》曰：「公用射隼」、以解悖也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_040.txt"
      },
      {
        "hexId": 41,
        "title": "損卦",
        "paragraphs": [
          "《象》曰：山下有澤，《損》。君子以懲忿窒欲。",
          "《象》曰：「已事遄往」，尚合志也。",
          "《象》曰：「九二利貞」，中以為志也。",
          "《象》曰：「一人行」，「三」則疑也。",
          "《象》曰：「損其疾」，亦可「喜」也。",
          "《象》曰：「六五」「元吉」，自上祐也。",
          "《象》曰：「弗損、益之」，大得志也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_041.txt"
      },
      {
        "hexId": 42,
        "title": "益卦",
        "paragraphs": [
          "《象》曰：風雷《益》。君子以見善則遷，有過則改。",
          "《象》曰：「元吉无咎」、下不厚事也。",
          "《象》曰：「或益之」、自外來也。",
          "《象》曰：「益用凶事」、固有之也。",
          "《象》曰：「告公從」、以益志也。",
          "《象》曰：「有孚惠心」、「勿問」之矣，「惠我德」、大得志也。",
          "《象》曰：「莫益之」、偏辭也，「或擊之」、自外來也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_042.txt"
      },
      {
        "hexId": 43,
        "title": "夬卦",
        "paragraphs": [
          "《象》曰：澤上於天，《夬》。君子以施祿及下，居德則忌。",
          "《象》曰：「不勝」而「往」、「咎」也。",
          "《象》曰：「有戎勿恤」、得中道也。",
          "《象》曰：「君子夬夬」、終「无咎」也。",
          "《象》曰：「其行次且」、位不當也，「聞言不信」、聰不明也。",
          "《象》曰：「中行无咎」、中未光也。",
          "《象》曰：「无號」之「凶」、終不可長也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_043.txt"
      },
      {
        "hexId": 44,
        "title": "姤卦",
        "paragraphs": [
          "《象》曰：天下有風，《姤》。后以施命誥四方。",
          "《象》曰：「繫于金柅」、柔道牽也。",
          "《象》曰：「包有魚」、義不及「賓」也。",
          "《象》曰：「其行次且」、行未牽也。",
          "《象》曰：「无魚」之「凶」、遠民也。",
          "《象》曰：「九五」「含章」、中正也，「有隕自天」、志不舍命也。",
          "《象》曰：「姤其角」、上窮「吝」也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_044.txt"
      },
      {
        "hexId": 45,
        "title": "萃卦",
        "paragraphs": [
          "《象》曰：澤上於地，《萃》。君子以除戎器，戒不虞。",
          "《象》曰：「乃亂乃萃」、其志亂也。",
          "《象》曰：「引吉无咎」、中未變也。",
          "《象》曰：「往无咎」、上巽也。",
          "《象》曰：「大吉无咎」、位不當也。",
          "《象》曰：「萃有位」、志未光也。",
          "《象》曰：「齎咨涕洟」、未安上也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_045.txt"
      },
      {
        "hexId": 46,
        "title": "升卦",
        "paragraphs": [
          "《象》曰：地中生木，升。君子以順德，積小以高大。",
          "《象》曰：「允升大吉」、上合志也。",
          "《象》曰：「九二」之「孚」、有喜也。",
          "《象》曰：「升虛邑」、无所疑也。",
          "《象》曰：「王用亨于岐山」、順事也。",
          "《象》曰：「貞吉升階」、大得志也。",
          "《象》曰：「冥升」在上、消不富也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_046.txt"
      },
      {
        "hexId": 47,
        "title": "困卦",
        "paragraphs": [
          "《象》曰：澤无水，困。君子以致命遂志。",
          "《象》曰：「入于幽谷」，幽、不明也。",
          "《象》曰：「困于酒食」、中有慶也。",
          "《象》曰：「據于蒺蔾」、乘剛也，「入于其宮不見其妻」、不祥也。",
          "《象》曰：「來徐徐」、志在下也。雖不當位，有與也。",
          "《象》曰：「劓刖」、志未得也，「乃徐有說」、以中直也，「利用祭祀」、受福也。",
          "《象》曰：「困于葛藟」、未當也，「動悔有悔」、「吉」行也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_047.txt"
      },
      {
        "hexId": 48,
        "title": "井卦",
        "paragraphs": [
          "《象》曰：木上有水，《井》。君子以勞民勸相。",
          "《象》曰：「井泥不食」、下也，「舊井无禽」、時舍也。",
          "《象》曰：「井谷射鮒」、无與也。",
          "《象》曰：「井渫不食」、行「惻」也，求「王明」、「受福」也。",
          "《象》曰：「井甃无咎」、脩井也。",
          "《象》曰：「寒泉」之「食」、中正也。",
          "《象》曰：「元吉」在「上」、大成也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_048.txt"
      },
      {
        "hexId": 49,
        "title": "革卦",
        "paragraphs": [
          "《象》曰：澤中有火，《革》。君子以治厤明時。",
          "《象》曰：「鞏用黃牛」、不可以有為也。",
          "《象》曰：「巳日革之」、行有嘉也。",
          "《象》曰：「革言三就」、又何之矣。",
          "《象》曰：「改命」之「吉」、信志也。",
          "《象》曰：「大人虎變」、其文炳也。",
          "《象》曰：「君子豹變」、其文蔚也，「小人革面」、順以從君也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_049.txt"
      },
      {
        "hexId": 50,
        "title": "鼎卦",
        "paragraphs": [
          "《象》曰：木上有火，《鼎》。君子以正位凝命。",
          "《象》曰：「鼎顛趾」、未悖也，「利出否」、以從貴也。",
          "《象》曰：「鼎有實」、慎所之也，「我仇有疾」、終无尤也。",
          "《象》曰：「鼎耳革」、失其義也。",
          "《象》曰：「覆公餗」、信如何也。",
          "《象》曰：「鼎黃耳」、中以為實也。",
          "《象》曰：「玉鉉」在「上」、剛柔節也。"
        ],
        "sourceUrl": "https://github.com/kanripo/KR1a0001/blob/8284adbf9e3435d713180e24f05bf75f8b7d1d96/KR1a0001_050.txt"
      },
      {
        "hexId": 51,
        "title": "震卦",
        "paragraphs": [
          "《象》曰：洊雷、《震》。君子以恐懼脩省。",
          "《象》曰：「震來虩虩」、恐致福也，「笑言啞啞」、「後」有則也。",
          "《象》曰：「震來厲」、乘剛也。",
          "《象》曰：「震蘇蘇」、位不當也。",
          "《象》曰：「震遂泥」、未光也。",
          "《象》曰：「震往來厲」、危行也，其事在中、大「无喪」也。",

        "paragraphs": [
          "《文言》曰：「元」者、善之長也，「亨」者、嘉之會也，《利》者、義之和也，「貞」者、事之幹也。君子體仁足以長人，嘉會足以合禮，利物足以和義，貞固足以幹事。君子行此四德者，故曰「乾、元、亨、利、貞」。",
          "初九曰、「潛龍勿用」，何謂也？子曰：「龍、德而隱者也。不易乎世，不成乎名，遯世无悶，不見是而无悶。樂則行之，憂則違之，確乎其不可拔，潛龍也。」",
          "九二曰、「見龍在田、利見大人」，何謂也？子曰：「龍德而正中者也。庸言之信，庸行之謹，閑邪存其誠，善世而不伐，德博而化。《易》曰、『見龍在田、利見大人』，君德也。」",
          "九三曰、「君子終日乾乾、夕惕若、厲、无咎」。何謂也？子曰：「君子進德脩業，忠信，所以進德也，脩辭立其誠，所以居業也。知至至之，可與幾也，知終終之，可與存義也。是故居上位而不驕，在下位而不憂，故乾乾因其時而惕，雖危无咎矣。」",
          "九四曰、「或躍在淵、无咎。」何謂也？子曰：「上下无常，非為邪也。進退无恆，非離群也。君子進德脩業、欲及時也，故无咎。」",
          "九五曰、「飛龍在天、利見大人」。何謂也？子曰：「同聲相應，同氣相求。水流濕，火就燥，雲從龍，風從虎，聖人作而萬物覩。本乎天者親上，本乎地者親下，則各從其類也。」",
          "上九曰、「亢龍有悔」，何謂也？子曰：「貴而无位，高而无民，賢人在下位而无輔，是以動而有悔也。」",
          "「潛龍勿用」、下也，「見龍在田」、時舍也，「終日乾乾」、行事也，「或躍在淵」、自試也，「飛龍在天」、上治也，「亢龍有悔」、窮之災也。乾元「用九」、天下治也。",
          "「潛龍勿用」，陽氣潛藏。「見龍在田」，天下文明。「終日乾乾」，與時偕行。「或躍在淵」，乾道乃革。「飛龍在天」，乃位乎天德。「亢龍有悔」，與時偕極。乾元「用九」，乃見天則。",
          "《乾》「元」「亨」者、始而亨者也。「利貞」者、性情也。乾始能以美利利天下，不言所利，大矣哉！",
          "大哉乾乎！剛健中正，純粹精也。六爻發揮，旁通情也。「時乘六龍」、以「御天」也，「雲行雨施」、天下平也。君子以成德為行，日可見之行也。",
          "「潛」之為言也，隱而未見，行而未成，是以君子「弗用」也。君子學以聚之，問以辯之，寬以居之，仁以行之。《易》曰、「見龍在田、利見大人」，君德也。九三重剛而不中，上不在天，下不在田，故「乾乾」因其時而「惕」，雖危「无咎」矣。九四重剛而不中，上不在天，下不在田，中不在人，故「或」之。「或」之者、疑之也，故「无咎」。夫「大人」者、與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶，先天而天弗違，後天而奉天時。天且弗違，而況於人乎？況於鬼神乎？「亢」之為言也，知進而不知退，知存而不知亡，知得而不知喪。其唯聖人乎！知進退存亡而不失其正者，其唯聖人乎！"

          "《文言》曰：《坤》至柔而動也剛，至靜而德方，後得主而有常，含萬物而化光。坤道其順乎，承天而時行。積善之家必有餘慶，積不善之家必有餘殃。臣弒其君，子弒其父，非一朝一夕之故，其所由來者漸矣，由辯之不早辯也。",

    "title": "系辞上传",
    "intro": "论述《易》的义理、卦爻与变化。",

      {
        "title": "系辞上传",
        "paragraphs": [
          "天尊地卑，乾坤定矣。卑高以陳，貴賤位矣。動靜有常，剛柔斷矣。",
          "方以類聚，物以群分，吉凶生矣。在天成象，在地成形，變化見矣。",
          "是故剛柔相摩，八卦相盪，鼓之以雷霆，潤之以風雨。日月運行，一寒一暑。",
          "乾道成男，坤道成女，乾知大始，坤作成物。乾以易知，坤以簡能。",
          "易則易知，簡則易從。易知則有親，易從則有功。有親則可久，有功則可大。可久則賢人之德，可大則賢人之業。",
          "易簡而天下之理得矣。天下之理得，而成位乎其中矣。",
          "聖人設卦觀象，繫辭焉而明吉凶。剛柔相推而生變化。",
          "是故吉凶者、失得之象也，悔吝者、憂虞之象也，變化者、進退之象也，剛柔者、晝夜之象也。六爻之動、三極之道也。",
          "是故君子所居而安者、《易》之序也，所樂而玩者、爻之辭也。",
          "是故君子居則觀其象而玩其辭，動則觀其變而玩其占，",
          "是以自天祐之，吉无不利。",
          "彖者、言乎象者也，爻者、言乎變者也，吉凶者、言乎其失得也，悔吝者、言乎其小疵也，无咎者、善補過也。",
          "是故列貴賤者存乎位，齊小大者存乎卦，辯吉凶者存乎辭，憂悔吝者存乎介，震无咎者存乎悔。",
          "是故卦有小大，辭有險易。辭也者、各指其所之。",
          "《易》與天地準，故能彌綸天地之道。",
          "仰以觀於天文，俯以察於地理，是故知幽明之故。原始反終，故知死生之說。",
          "精氣為物，遊魂為變，是故知鬼神之情狀。",
          "與天地相似，故不違。知周乎萬物，而道濟天下，故不過。",
          "旁行而不流，樂天知命，故不憂。安土敦乎仁，故能愛。",
          "範圍天地之化而不過，曲成萬物而不遺，通乎晝夜之道而知，故神无方而易无體。",
          "一陰一陽之謂道，繼之者善也，成之者性也。",
          "仁者見之謂之仁，知者見之謂之知，百姓日用而不知，故君子之道鮮矣。",
          "顯諸仁，藏諸用，鼓萬物而不與聖人同憂，盛德大業至矣哉！",
          "富有之謂大業，日新之謂盛德。",
          "生生之謂易，成象之謂乾，效法之謂坤，",

          "變通配四時，陰陽之義配日月，易簡之善配至德。子曰：「《易》、其至矣乎！夫《易》、聖人所以崇德而廣業也。知崇禮卑，崇效天，卑法地。天地設位，而《易》行乎其中矣。成性存存，道義之門。」",
          "聖人有以見天下之賾，而擬諸其形容，象其物宜，是故謂之象。聖人有以見天下之動，而觀其會通，以行其典禮，繫辭焉以斷其吉凶，是故謂之爻，言天下之至賾而不可惡也，言天下之至動而不可亂也。擬之而後言，議之而後動，擬議以成其變化。「鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。」子曰：「君子居其室，出其言善，則千里之外應之，況其邇者乎？居其室，出其言不善，則千里之外違之，況其邇者乎？言出乎身，加乎民；行發乎邇，見乎遠。言行、君子之樞機。樞機之發、榮辱之主也，言行、君子之所以動天地也。可不慎乎！」「同人先號咷而後笑。」子曰：「君子之道，或出或處，或默或語。二人同心，其利斷金。同心之言，其臭如蘭。」",
          "「初六：藉用白茅，无咎。」子曰：「苟錯諸地而可矣，藉之用茅，何咎之有？慎之至也。夫茅之為物薄，而用可重也。慎斯術也以往，其无所失矣。」「勞謙，君子有終，吉。」子曰：「勞而不伐，有功而不德，厚之至也。語以其功下人者也。德言盛，禮言恭。謙也者、致恭以存其位者也。」「亢龍有悔。」子曰：「貴而无位，高而无民，賢人在下位而无輔，是以動而有悔也。」「不出戶庭，无咎。」子曰：「亂之所生也，則言語以為階。君不密則失臣，臣不密則失身，幾事不密則害成。是以君子慎密而不出也。」子曰：「作《易》者、其知盜乎？《易》曰：『負且乘，致寇至。』負也者、小人之事也，乘也者、君子之器也。小人而乘君子之器，盜思奪之矣。上慢下暴，盜思伐之矣。慢藏誨盜，冶容誨淫。《易》曰：『負且乘，致寇至。』，盜之招也。」",
          "大衍之數五十，其用四十有九。分而為二以象兩。掛一以象三，揲之以四以象四時，歸奇於扐以象閏。五歲再閏，故再扐而後掛。天數五，地數五。五位相得而各有合，天數二十有五，地數三十，凡天地之數五十有五，此所以成變化而行鬼神也。《乾》之策二百一十有六，《坤》之策百四十有四，凡三百有六十，當期之日。二篇之策萬有一千五百二十，當萬物之數也。是故四營而成《易》，十有八變而成卦，八卦而小成。引而伸之，觸類而長之，天下之能事畢矣。顯道、神德行，是故可與酬酢，可與祐神矣。",
          "子曰：「知變化之道者，其知神之所為乎。」《易》有聖人之道四焉：以言者尚其辭，以動者尚其變，以制器者尚其象，以卜筮者尚其占。是以君子將有為也，將有行也，問焉而以言。其受命也如響。无有遠近幽深，遂知來物。非天下之至精，其孰能與於此。參伍以變，錯綜其數。通其變，遂成天下之文；極其數，遂定天下之象。非天下之至變，其孰能與於此？《易》无思也，无為也，寂然不動，感而遂通天下之故。非天下之至神，其孰能與於此？夫《易》、聖人之所以極深而研幾也。唯深也，故能通天下之志；唯幾也，故能成天下之務；唯神也，故不疾而速，不行而至。子曰：「《易》有聖人之道四焉」者，此之謂也。",
          "天一，地二；天三，地四；天五，地六；天七，地八；天九，地十。子曰：「夫《易》、何為者也？夫《易》、開物成務，冒天下之道，如斯而已者也。」是故聖人以通天下之志，以定天下之業，以斷天下之疑。是故蓍之德圓而神，卦之德方以知，六爻之義易以貢。聖人以此洗心，退藏於密，吉凶與民同患。神以知來，知以藏往，其孰能與此哉！古之聰明叡知神武而不殺者夫！是以明於天之道，而察於民之故，是興神物以前民用。聖人以此齊戒，以神明其德夫。是故闔戶謂之坤，闢戶謂之乾，一闔一闢謂之變，往來不窮謂之通，見乃謂之象，形乃謂之器，制而用之謂之法，利用出入，民咸用之謂之神。",
          "是故《易》有太極，是生兩儀。兩儀生四象。四象生八卦。八卦定吉凶。吉凶生大業。是故法象莫大乎天地。變通莫大乎四時。縣象著明莫大乎日月。崇高莫大乎富貴。備物致用，立功成器，以為天下利，莫大乎聖人。探賾索隱，鉤深致遠，以定天下之吉凶，成天下之亹亹者，莫善乎蓍龜。是故天生神物，聖人則之。天地變化，聖人效之。天垂象，見吉凶，聖人象之。河出圖，洛出書，聖人則之。《易》有四象，所以示也。繫辭焉，所以告也。定之以吉凶，所以斷也。《易》曰：「自天祐之，吉无不利。」子曰：「祐者、助也。天之所助者、順也，人之所助者、信也。履信思乎順，又以尚賢也。是以自天祐之，吉无不利也。」",

        "paragraphs": [
          "八卦成列，象在其中矣。因而重之，爻在其中矣。剛柔相推，變在其中矣。繫辭焉而命之，動在其中矣。吉凶悔吝者、生乎動者也，剛柔者、立本者也，變通者、趣時者也，吉凶者、貞勝者也。天地之道，貞觀者也。日月之道、貞明者也，天下之動、貞夫一者也。夫乾、確然示人易矣，夫坤、隤然示人簡矣。爻也者、效此者也，象也者、像此者也。爻象動乎內，吉凶見乎外，功業見乎變，聖人之情見乎辭。天地之大德曰生，聖人之大寶曰位。何以守位曰仁，何以聚人曰財，理財正辭、禁民為非曰義。",

          "是故《易》者、象也，象也者、像也。彖者、材也，爻也者、效天下之動者也。是故吉凶生而悔吝著也。陽卦多陰，陰卦多陽，其故何也？陽卦奇，陰卦耦。其德行何也？陽、一君而二民，君子之道也；陰、二君而一民，小人之道也。《易》曰：「憧憧往來，朋從爾思。」子曰：「天下何思何慮？天下同歸而殊塗，一致而百慮。天下何思何慮？日往則月來，月往則日來，日月相推而明生焉。寒往則暑來，暑往則寒來，寒暑相推而歲成焉。往者屈也，來者信也，屈、信相感而利生焉。尺蠖之屈，以求信也。龍蛇之蟄，以存身也。精義入神，以致用也。利用安身，以崇德也。過此以往，未之或知也。窮神知化，德之盛也。」",
          "《易》曰：「困于石，據于蒺蔾，入于其宮，不見其妻，凶。」子曰：「非所困而困焉，名必辱。非所據而據焉，身必危。既辱且危，死期將至，妻其可得見耶！」《易》曰：「公用射隼于高墉之上，獲之，无不利。」子曰：「隼者、禽也，弓矢者、器也，射之者、人也。君子藏器於身，待時而動，何不利之有？動而不括，是以出而有獲，語成器而動者也。」子曰：「小人不恥不仁，不畏不義，不見利不勸，不威不懲。小懲而大誡，此小人之福也。《易》曰：『屨校滅趾，无咎。』此之謂也。」「善不積不足以成名，惡不積不足以滅身。小人以小善為无益而弗為也，以小惡為无傷而弗去也，故惡積而不可揜，罪大而不可解。《易》曰：『何校滅耳，凶。』」子曰：「危者、安其位者也，亡者、保其存者也，亂者、有其治者也。是故君子安而不忘危，存而不忘亡，治而不忘亂，是以身安而國家可保也。《易》曰：『其亡其亡，繫于苞桑。』」子曰：「德薄而位尊，知小而謀大，力少而任重，鮮不及矣。《易》曰：『鼎折足，覆公餗，其形渥，凶。』言不勝其任也。」子曰：「知幾其神乎！君子上交不諂，下交不瀆，其知幾乎？幾者、動之微、吉之先見者也。君子見幾而作。不俟終日。《易》曰：『介于石，不終日，貞吉。』介如石焉，寧用終日，斷可識矣。君子知微知彰，知柔知剛，萬夫之望。」子曰：「顏氏之子，其殆庶幾乎？有不善未嘗不知，知之未嘗復行也。《易》曰：『不遠復，无衹悔，元吉。』」天地絪縕，萬物化醇。男女構精，萬物化生。《易》曰：『三人行則損一人，一人行則得其友。』言致一也。子曰：「君子安其身而後動，易其心而後語，定其交而後求。君子脩此三者，故全也。危以動，則民不與也。懼以語，則民不應也。无交而求，則民不與也。莫之與，則傷之者至矣。《易》曰：『莫益之，或擊之，立心勿恆，凶。』」",
          "子曰：「乾坤，其《易》之門邪？」乾、陽物也，坤、陰物也。陰陽合德，而剛柔有體。以體天地之撰，以通神明之德。其稱名也，雜而不越。於稽其類，其衰世之意邪？夫《易》、彰往而察來，而微顯、闡幽，開而當名，辯物正言，斷辭則備矣。其稱名也小，其取類也大。其旨遠，其辭文，其言曲而中，其事肆而隱。因貳以濟民行，以明失得之報。",
          "《易》之興也，其於中古乎？作《易》者、其有憂患乎？是故《履》、德之基也，《謙》、德之柄也，《復》、德之本也，《恆》、德之固也，《損》、德之脩也，《益》、德之裕也，《困》、德之辯也，《井》、德之地也，《巽》、德之制也，《履》、和而至，《謙》、尊而光，《復》、小而辨於物，《恆》、雜而不厭，《損》、先難而後易，《益》、長裕而不設，《困》、窮而通，《井》、居其所而遷，《巽》、稱而隱。《履》以和行，《謙》以制禮，《復》以自知，《恆》以一德，《損》以遠害，《益》以興利，《困》以寡怨，《井》以辯義，《巽》以行權。",
          "《易》之為書也不可遠，為道也屢遷，變動不居，周流六虛，上下无常，剛柔相易，不可為典要，唯變所適。其出入以度外內，使知懼。又明於憂患與故。无有師保，如臨父母。初率其辭而揆其方，既有典常。苟非其人，道不虛行。《易》之為書也，原始要終，以為質也。六爻相雜，唯其時物也。其初難知，其上易知，本末也。初辭擬之，卒成之終。若夫雜物撰德，辯是與非，則非其中爻不備。噫亦要存亡吉凶，則居可知矣。知者觀其彖辭，則思過半矣。",

          "雷以動之，風以散之，雨以潤之，日以烜之，艮以止之，兌以說之，乾以君之，坤以藏之。帝出乎震，齊乎巽，相見乎離，致役乎坤，說言乎兌，戰乎乾，勞乎坎，成言乎艮。萬物出乎震，震東方也。齊乎巽，巽東南也，齊也者、言萬物之絜齊也。離也者、明也，萬物皆相見，南方之卦也。聖人南面而聽天下，嚮明而治，蓋取諸此也。坤也者、地也，萬物皆致養焉，故曰：致役乎坤。兌、正秋也，萬物之所說也，故曰：說言乎兌。戰乎乾，乾、西北之卦也，言陰陽相薄也。坎者、水也，正北方之卦也，勞卦也，萬物之所歸也，故曰：勞乎坎。艮、東北之卦也。萬物之所成終而所成始也。故曰：成言乎艮。",
          "神也者、妙萬物而為言者也。動萬物者莫疾乎雷，橈萬物者莫疾乎風，燥萬物者莫熯乎火，說萬物者莫說乎澤，潤萬物者莫潤乎水，終萬物、始萬物者、莫盛乎艮。故水火相逮，雷風不相悖，山澤通氣，然後能變化，既成萬物也。",
          "乾、健也，坤、順也，震、動也，巽、入也，坎、陷也，離、麗也，艮、止也，兌、說也。",
          "乾為馬。坤為牛。震為龍。巽為雞。坎為豕。離為雉。艮為狗。兌為羊。",
          "乾為首。坤為腹。震為足。巽為股。坎為耳。離為目。艮為手。兌為口。",
          "乾、天也，故稱乎父。坤、地也，故稱乎母。震一索而得男，故謂之長男。巽一索而得女，故謂之長女。坎再索而得男，故謂之中男。離再索而得女，故謂之中女。艮三索而得男，故謂之少男。兌三索而得女，故謂之少女。",
          "乾為天，為圜，為君，為父，為玉，為金，為寒，為冰，為大赤，為良馬，為老馬，為瘠馬，為駁馬，為木果。",
          "坤為地，為母，為布，為釜，為吝嗇，為均，為子母牛，為大輿，為文，為眾，為柄，其於地也為黑。",
          "震為雷，為龍，為玄黃，為旉，為大塗，為長子，為決躁，為蒼筤竹，為萑葦。其於馬也，為善鳴，為馵足，為作足，為的顙。其於稼也，為反生。其究為健，為蕃鮮。",
          "巽為木，為風，為長女，為繩直，為工，為白，為長，為高，為進退，為不果，為臭。其於人也，為宣髮，為廣顙，為多白眼，為近利市三倍，其究為躁卦。",
          "坎為水，為溝瀆，為隱伏，為矯輮，為弓輪。其於人也，為加憂，為心病，為耳痛，為血卦，為赤。其於馬也，為美脊，為亟心，為下首，為薄蹄，為曳。其於輿也，為多眚，為通，為月，為盜。其於木也，為堅多心。",
          "離為火，為日，為電，為中女，為甲冑，為戈兵。其於人也，為大腹。為乾卦，為鱉，為蟹，為蠃，為蚌，為龜。其於木也，為科上槁。",

        "title": "序卦传",
        "paragraphs": [
          "有天地，然後萬物生焉。盈天地之間者唯萬物，故受之以《屯》。《屯》者、盈也。屯者、物之始生也。物生必蒙，故受之以《蒙》。《蒙》者、蒙也，物之稺也。物稺不可不養也，故受之以《需》。《需》者、飲食之道也。飲食必有訟，故受之以《訟》。訟必有眾起，故受之以《師》。《師》者、眾也。眾必有所比，故受之以《比》。《比》者、比也。比必有所畜，故受之以《小畜》。物畜然後有禮，故受之以《履》。《履》者、禮也。履而泰然後安，故受之以《泰》。《泰》者、通也。物不可以終通，故受之以《否》。物不可以終否，故受之以《同人》。與人同者，物必歸焉，故受之以《大有》。有大者不可以盈，故受之以《謙》。有大而能謙必豫，故受之以《豫》。豫必有隨，故受之以《隨》。以喜隨人者必有事，故受之以《蠱》。《蠱》者、事也。有事而後可大，故受之以《臨》。《臨》者、大也。物大然後可觀，故受之以《觀》。可觀而後有所合，故受之以《噬嗑》。嗑者、合也。物不可以苟合而已，故受之以《賁》。《賁》者、飾也。致飾然後亨則盡矣，故受之以《剝》。《剝》者、剝也。物不可以終盡剝，窮上反下，故受之以《復》。復則不妄矣，故受之以《无妄》。有无妄，物然後可畜，故受之以《大畜》。物畜然後可養，故受之以《頤》。《頤》者、養也。不養則不可動，故受之以《大過》。物不可以終過，故受之以《坎》。《坎》者、陷也。陷必有所麗，故受之以《離》。《離》者、麗也。",
          "有天地然後有萬物，有萬物然後有男女，有男女然後有夫婦，有夫婦然後有父子，有父子然後有君臣，有君臣然後有上下，有上下然後禮義有所錯。夫婦之道不可以不久也，故受之以《恆》。《恆》者、久也。物不可以久居其所，故受之以《遯》。《遯》者、退也。物不可以終遯，故受之以《大壯》。物不可以終壯，故受之以《晉》。《晉》者、進也。進必有所傷，故受之以《明夷》。夷者、傷也。傷於外者必反於家，故受之以《家人》。家道窮必乖，故受之以《睽》。《睽》者、乖也。乖必有難，故受之以《蹇》。《蹇》者、難也。物不可以終難，故受之以《解》。《解》者、緩也。緩必有所失，故受之以《損》。損而不已必益，故受之以《益》。益而不已必決，故受之以《夬》。《夬》者、決也。決必有遇，故受之以《姤》。《姤》者、遇也。物相遇而後聚，故受之以《萃》。《萃》者、聚也。聚而上者謂之升，故受之以《升》。升而不已必困，故受之以《困》。困乎上者必反下，故受之以《井》。井道不可不革，故受之以《革》。革物者莫若鼎，故受之以《鼎》。主器者莫若長子，故受之以《震》。《震》者、動也。物不可以終動，止之，故受之以《艮》。《艮》者、止也。物不可以終止，故受之以《漸》。漸者、進也。進必有所歸，故受之以《歸妹》。得其所歸者必大，故受之以《豐》。《豐》者、大也。窮大者必失其居，故受之以《旅》。旅而无所容，故受之以《巽》。《巽》者、入也。入而後說之，故受之以《兌》。《兌》者、說也。說而後散之，故受之以《渙》。《渙》者、離也。物不可以終離，故受之以《節》。節而信之，故受之以《中孚》。有其信者必行之，故受之以《小過》。有過物者必濟，故受之以《既濟》。物不可窮也，故受之以《未濟》，終焉。"
