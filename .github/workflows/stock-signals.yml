name: Update stock signals
run-name: Stock signals · ${{ github.event_name }} · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-signals.yml'
      - '.github/workflows/stock-scan-phase.yml'
      - '.github/workflows/stock-publish-phase.yml'
      - 'stock/source/scripts/scan-*.mjs'
      - 'stock/source/scripts/scan-*.py'
      - 'stock/source/scripts/merge-scans.mjs'
      - 'stock/source/scan-plan.js'
      - 'stock/source/strategy-config.js'
      - 'stock/source/macd.js'
      - 'stock/source/signal-model.js'
      - 'stock/source/server.py'
      - 'stock/source/cloud_cache.py'
  workflow_dispatch:
  schedule:
    # Beijing 10:05–15:50 every 15 min; 16:05 completed daily-bar refresh.
    # GitHub schedules are best effort and can run late.
    - cron: '5,20,35,50 2-7 * * 1-5'
    - cron: '5 8 * * 1-5'
permissions:
  contents: write
  pages: write
concurrency:
  group: stock-signals
  cancel-in-progress: false
jobs:
  quick-scan:
    uses: ./.github/workflows/stock-scan-phase.yml
    with:
      phase: quick
      seconds: 120
  quick-publish:
    needs: quick-scan
    if: always()
    uses: ./.github/workflows/stock-publish-phase.yml
    with:
      phase: quick
  complete-scan:
    needs: quick-publish
    if: always()
    uses: ./.github/workflows/stock-scan-phase.yml
    with:
      phase: complete
      seconds: 540
  complete-publish:
    needs: complete-scan
    if: always()
    uses: ./.github/workflows/stock-publish-phase.yml
    with:
      phase: complete
