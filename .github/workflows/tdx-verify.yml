name: Verify official Tongdaxin data
on:
  push:
    branches: [main]
    paths: ['stock/source/validation/tdx-request.json']
  workflow_dispatch:
    inputs:
      include_pro:
        description: 'Also request 10 ticks and one GP07 professional-data query per stock (may consume credits)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r stock/source/requirements-tdx.txt
      - name: Real official-only checks, never substitute backup prices
        env:
          TDX_DATA_KEY: ${{ secrets.TDX_DATA_KEY }}
          INCLUDE_PRO: ${{ inputs.include_pro || github.event_name == 'push' }}
        run: |
          MODEL_ONLY=$(python -c 'import json,pathlib; p=pathlib.Path("stock/source/validation/tdx-request.json"); print("true" if p.exists() and json.loads(p.read_text()).get("mode")=="model_only" else "false")')
          if [ "$MODEL_ONLY" = "true" ]; then
            python stock/source/scripts/verify-tdx.py --model-only --output /tmp/tdx-report.json
          elif [ "$INCLUDE_PRO" = "true" ]; then
            python stock/source/scripts/verify-tdx.py --include-pro --output /tmp/tdx-report.json
          else
            python stock/source/scripts/verify-tdx.py --output /tmp/tdx-report.json
          fi
      - name: Save safe acceptance summary for review
        if: always()
        env:
          TDX_DATA_KEY: ${{ secrets.TDX_DATA_KEY }}
        run: |
          if [ -f /tmp/tdx-report.json ]; then
            python - <<'PYREPORT'
          import json, os
          from pathlib import Path
          report=json.loads(Path('/tmp/tdx-report.json').read_text())
          for rows in report.get('results',{}).values():
              for result in rows.values():
                  result.pop('sample_bars',None)
          output=json.dumps(report,ensure_ascii=False,indent=2)+'\n'
          secret=os.environ.get('TDX_DATA_KEY','')
          if secret and secret in output:
              raise RuntimeError('Credential detected; refusing to publish report')
          Path('stock/source/validation/tdx-live.json').write_text(output,encoding='utf-8')
          PYREPORT
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock/source/validation/tdx-live.json
            if ! git diff --cached --quiet; then
              git commit -m "Record official Tongdaxin acceptance results"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-tdx-verification
          path: /tmp/tdx-report.json
          if-no-files-found: warn
          retention-days: 3
