name: Check stock update scheduler
run-name: Stock watchdog · ${{ github.event_name }} · ${{ github.run_id }}
on:
  schedule:
    - cron: '35 2,3 * * 1-5'
    - cron: '5 6,7 * * 1-5'
    - cron: '2-59/5 2-15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: stock-watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exchange day and latest due snapshot without paid APIs
        id: due
        run: python stock/source/scripts/scan-due.py
      - name: Recover original scan if no job is active
        if: steps.due.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python stock/source/scripts/watchdog-dispatch.py
