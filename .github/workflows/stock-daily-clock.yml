name: Daily stock process clock
run-name: Stock daily clock · ${{ github.event_name }} · ${{ github.run_id }}
on:
  schedule:
    # Start before the market opens, away from the top-of-hour load spike.
    # One successful start keeps all four slots inside the same running workflow.
    - cron: '5 0 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: stock-signals
  cancel-in-progress: false
jobs:
  wait1035:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait inside the running workflow until Beijing 10:35
        env:
          DAILY_CLOCK: 'true'
        run: python -u stock/source/scripts/wait-update-slot.py --slot 10:35
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stock-schedule-state.json
          key: stock-schedule-state-v1-${{ github.run_id }}-1035-${{ github.run_attempt }}
          restore-keys: stock-schedule-state-v1-
      - name: Read latest snapshot and enforce freshness and bounded retry checks
        id: due
        env:
          TDX_OVERRIDE: ${{ vars.TDX_ENABLED }}
          TDX_ADJUSTMENT: ${{ vars.TDX_ADJUSTMENT || 'none' }}
          SCHEDULE_SCAN_STATE: ${{ runner.temp }}/stock-schedule-state.json
        run: |
          git fetch origin main
          git checkout --detach origin/main
          python stock/source/scripts/scan-due.py
  quick1035:
    needs: wait1035
    if: always() && needs.wait1035.outputs.run == 'true'
    uses: ./.github/workflows/stock-scan-phase.yml
    secrets:
      TDX_DATA_KEY: ${{ secrets.TDX_DATA_KEY }}
    with:
      phase: quick
      seconds: 120
      artifact_prefix: stock-daily-1035
  publishquick1035:
    needs: [wait1035, quick1035]
    if: always() && needs.wait1035.outputs.run == 'true'
    uses: ./.github/workflows/stock-publish-phase.yml
    with:
      phase: quick
      artifact_prefix: stock-daily-1035
  complete1035:
    needs: [wait1035, publishquick1035]
    if: always() && needs.wait1035.outputs.run == 'true'
    uses: ./.github/workflows/stock-scan-phase.yml
    secrets:
      TDX_DATA_KEY: ${{ secrets.TDX_DATA_KEY }}
    with:
      phase: complete
      seconds: 720
      artifact_prefix: stock-daily-1035
  publish1035:
    needs: [wait1035, complete1035]
    if: always() && needs.wait1035.outputs.run == 'true'
    uses: ./.github/workflows/stock-publish-phase.yml
    with:
      phase: complete
      artifact_prefix: stock-daily-1035
  wait1135:
