name: Stock publish phase
on:
  workflow_call:
    inputs:
      artifact_prefix:
        type: string
        required: false
        default: stock-signals
      phase:
        required: true
        type: string
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: stock-snapshot-publish
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_prefix }}-${{ inputs.phase }}-*
          path: stock/source/scan-results
          merge-multiple: true
      - name: Merge current records and compute actual coverage
        working-directory: stock/source
        run: node scripts/merge-scans.mjs
      - name: Build published snapshots
        env:
          MARKET_API_BASE: ${{ vars.MARKET_API_BASE }}
        working-directory: stock/source
        run: npm run build -- ..
      - name: Save results and publish Pages
        run: python stock/source/scripts/publish-snapshot.py
      - name: Request Pages rebuild for bot commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
