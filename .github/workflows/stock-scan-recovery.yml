name: Recover obsolete stock scan
on:
  push:
    branches: [main]
    paths: ['stock/source/validation/scan-recovery-request.json']
permissions:
  contents: read
  actions: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Cancel only the explicitly obsolete recovery run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          r=json.loads(Path('stock/source/validation/scan-recovery-request.json').read_text())
          assert isinstance(r['run_id'],int) and r['run_id']>0
          base='repos/'+os.environ['REPOSITORY']+'/actions/runs/'+str(r['run_id'])
          p=subprocess.run(['gh','api',base],capture_output=True,text=True,check=True)
          data=json.loads(p.stdout)
          if data['head_sha']!=r['obsolete_sha']:raise RuntimeError('Run SHA changed; refusing cancellation')
          if data['status']!='completed':
              subprocess.run(['gh','api','--method','POST',base+'/cancel'],check=True)
              for _ in range(3):
                  time.sleep(3)
                  data=json.loads(subprocess.run(['gh','api',base],capture_output=True,text=True,check=True).stdout)
                  if data['status']=='completed':break
              if data['status']!='completed':
                  subprocess.run(['gh','api','--method','POST',base+'/force-cancel'],check=True)
                  print('::notice::Force cancellation requested for the explicitly obsolete parser run; always-run jobs no longer hold the repaired scan.')
              else:print('::notice::Obsolete scan completed cancellation.')
          else:print('Obsolete scan already completed; no cancellation needed.')
          PY
