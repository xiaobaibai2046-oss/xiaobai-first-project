name: Inspect official intraday hourly contract
on:
  push:
    branches: [main]
    paths: ['stock/source/validation/tdx-intraday-request.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r stock/source/requirements-tdx.txt
      - name: Read two real official hourly responses, without fallback
        env:
          TDX_DATA_KEY: ${{ secrets.TDX_DATA_KEY }}
        run: python stock/source/scripts/inspect-tdx-hourly.py
      - name: Save safe contract report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/source/validation/tdx-intraday.json
          git commit -m "Record actual official intraday bar contract"
          git pull --rebase origin main
          git push origin HEAD:main
